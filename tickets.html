<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Билеты — Hall of Fame</title>

<!-- ============================================================
     ⚙ НАСТРОЙКА ⚙
     TICKETS_CSV_URL — лист Tickets
     CONFIG_CSV_URL — лист Config (дата розыгрыша, баннер таймера)
     VIEWERS_CSV_URL — лист Viewers (аватарки зрителей)
     HOME_URL — ссылка на главную
     ============================================================ -->
<script>
  const TICKETS_CSV_URL = "data/tickets.json";
  const CONFIG_CSV_URL  = "data/config.json";
  const VIEWERS_CSV_URL = "data/viewers.json";
  const HOME_URL = "./";
</script>

<link rel="stylesheet" href="core/site.css?v=7">
<link rel="stylesheet" href="modules/tickets/tickets.page.css?v=1">
</head>

<body>

<script src="core/core.js?v=1"></script><script src="core/site.js?v=19"></script>

  <div class="wrap">
    <div class="header">
      <h1 class="title"><svg class="ic" aria-hidden="true"><use href="#i-ticket"></use></svg>Билеты<svg class="ic" aria-hidden="true"><use href="#i-ticket"></use></svg></h1>
      <p class="subtitle">Чем больше билетов — тем выше шанс</p>
    </div>

    <div id="timer-box" class="timer-box">
      <div class="timer-bg" id="timer-bg"></div>
      <div class="timer-content">
        <div class="timer-event" id="timer-event">До розыгрыша</div>
        <div class="timer-countdown" id="timer-countdown">
          <div class="timer-unit"><div class="timer-num" id="t-days">0</div><div class="timer-label">дней</div></div>
          <div class="timer-unit"><div class="timer-num" id="t-hours">0</div><div class="timer-label">часов</div></div>
          <div class="timer-unit"><div class="timer-num" id="t-mins">0</div><div class="timer-label">минут</div></div>
          <div class="timer-unit"><div class="timer-num" id="t-secs">0</div><div class="timer-label">секунд</div></div>
        </div>
        <div class="timer-when" id="timer-when"></div>
        <div id="timer-finished" class="timer-finished" style="display:none;"><svg class="ic ic--fill" aria-hidden="true"><use href="#i-zap"></use></svg>Розыгрыш уже идёт или завершён</div>
      </div>
    </div>

    <div class="controls">
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" class="search-input" id="search-input" placeholder="Найти себя по нику..." aria-label="Найти себя по нику"></label>
    </div>

    <div id="status" class="status">Загружаю билеты...</div>

    <div id="content" style="display:none;">
      <div id="podium-wrap" style="display:none;">
        <p class="podium-title">Топ 3</p>
        <div class="podium" id="podium"></div>
      </div>
      <div id="rest-wrap" style="display:none;">
        <p class="grid-title">Остальные участники</p>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>

<script src="modules/tickets/tickets.page.js?v=1"></script>
</body>
</html>
