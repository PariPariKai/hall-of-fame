<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Чат — OBS</title>
<!--
  Свой чат-оверлей для OBS: browser source 1920×1080, прозрачный фон, на весь экран — область чата задаётся в настройках.
    chat.html?o=<id>   — какой оверлей (их может быть несколько: чат сбоку, бегущая строка, только алерты)
  Режимы: колонка, строка, летающий, новости, только алерты. События (стрики, сабки, рейды, биты...) выделяются в чате
  и/или показываются анимацией. Настройки — data/chat.json, правятся в админке на вкладке «Чат»; оверлей перечитывает их
  раз в 30 секунд. Чат Twitch — анонимно, только чтение.
  Необязательно: &channel=ник — другой канал; &demo — предпросмотр с ненастоящим чатом и событиями;
  &embed — предпросмотр внутри админки (настройки приходят из админки, рамку области можно таскать).
-->
<link rel="stylesheet" href="modules/chat/chat.page.css?v=1">
</head>
<body>
<div class="area" id="area"><div class="feed" id="feed"></div></div>
<div class="alerts" id="alerts"></div>

<script src="core/core.js?v=1"></script>
<script src="kits/chat-kit.js?v=2"></script>
<script>
// ненастоящий чат
// Версия страницы. Менять при каждой правке chat.html, modules/chat/chat.page.js или chat-kit.js (и ?v= у chat-kit.js):
// OBS держит копию страницы до 10 минут, а так оверлей сам замечает новую версию и перезагружается.
const VERSION = '2026-11-21.2';
</script>
<script src="modules/chat/chat.page.js?v=1"></script>
</body>
</html>
