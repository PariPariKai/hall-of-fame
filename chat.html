<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Чат — OBS</title>
<!--
  Свой чат-оверлей для OBS: browser source 1920×1080, прозрачный фон, на весь экран — область чата задаётся в настройках.
    chat.html?o=<id>   — какой оверлей (их может быть несколько: чат сбоку, бегущая строка, только алерты)
  Режимы: колонка, строка, летающий, новости, только алерты. События (стрики, сабки, рейды, биты...) выделяются в чате
  и/или показываются анимацией. Настройки — data/chat.json, правятся в админке на вкладке «Чат»; оверлей перечитывает их
  раз в 30 секунд. Чат Twitch — анонимно, только чтение.
  Необязательно: &channel=ник — другой канал; &demo — предпросмотр с ненастоящим чатом и событиями;
  &embed — предпросмотр внутри админки (настройки приходят из админки, рамку области можно таскать).
-->
<style>
  :root {
    --u: calc(100vw / 1920);
    --fs: 26; --w: 500; --nw: 700; --rad: 12; --pad: 10; --gap: 8; --alpha: 1; --as: 1;
    --font: "Segoe UI", Roboto, Arial, sans-serif;
    --tc: #fff; --bg: rgba(11,14,24,.55); --acc: #FAC775; --acc-a: rgba(250,199,117,.28); --acc-g: rgba(250,199,117,.45);
    --tkl: #d8263a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font); color: var(--tc); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .px { font-size: calc(var(--fs) * var(--u)); }

  /* ---------- область чата ---------- */
  .area { position: absolute; opacity: var(--alpha); }
  .feed { position: absolute; inset: 0; display: flex; overflow: hidden; gap: calc(var(--gap) * var(--u)); }
  .bg-area { background: var(--bg); border-radius: calc(var(--rad) * var(--u)); }
  .bg-area .feed { inset: calc(var(--pad) * var(--u)); }

  /* ---------- сообщение ---------- */
  .m {
    position: relative; max-width: 100%; flex: 0 0 auto;
    font-size: calc(var(--fs) * var(--u)); font-weight: var(--w); line-height: 1.32; overflow-wrap: anywhere;
    padding: calc(var(--pad) * var(--u)) calc(var(--pad) * 1.35 * var(--u));
    border-radius: calc(var(--rad) * var(--u)); background: var(--bg);
  }
  .bg-none .m, .bg-area .m { background: transparent; padding-left: 0; padding-right: 0; }
  .bg-area .m { padding-top: 0; padding-bottom: 0; }
  .outline .m, .outline .al {
    --ol: rgba(0,0,0,.85);
    text-shadow: calc(-1.6 * var(--u)) calc(-1.6 * var(--u)) 0 var(--ol), calc(1.6 * var(--u)) calc(-1.6 * var(--u)) 0 var(--ol),
      calc(-1.6 * var(--u)) calc(1.6 * var(--u)) 0 var(--ol), calc(1.6 * var(--u)) calc(1.6 * var(--u)) 0 var(--ol),
      0 calc(2 * var(--u)) 0 var(--ol), 0 calc(-2 * var(--u)) 0 var(--ol), calc(2 * var(--u)) 0 0 var(--ol), calc(-2 * var(--u)) 0 0 var(--ol),
      0 0 calc(10 * var(--u)) rgba(0,0,0,.5);
  }
  .m__who { white-space: nowrap; }
  .m__nick { font-weight: var(--nw); }
  .m__colon { margin-right: .32em; font-weight: var(--nw); }
  .lay-stack .m__who { display: block; margin-bottom: .08em; }
  .lay-stack .m__colon { display: none; }
  .m--sys .m__colon { display: none; }
  .bd {
    display: inline-grid; place-items: center; width: 1.08em; height: 1.08em; margin-right: .26em; border-radius: .24em;
    vertical-align: -.16em; text-shadow: none;
  }
  .bd svg { width: .74em; height: .74em; fill: #fff; }
  .bd--broadcaster { background: #e91916; } .bd--moderator { background: #00ad03; }
  .bd--vip { background: #e005b9; } .bd--sub { background: #8a3ffc; }
  .bd__n { font-size: .5em; font-weight: 800; color: #fff; margin-left: -.1em; }
  .emote { height: 1.55em; width: auto; vertical-align: -.45em; margin: 0 .05em; }
  .emote--giant { height: 4.2em; vertical-align: bottom; }

  /* событие: цветная кромка, подсветка и подпись */
  .m--ev {
    background: linear-gradient(90deg, var(--acc-a), transparent 85%), var(--bg);
    box-shadow: inset calc(5 * var(--u)) 0 0 var(--acc), 0 0 calc(22 * var(--u)) var(--acc-g);
    animation: ev-glow 1.6s ease-in-out 3;
  }
  .bg-none .m--ev, .bg-area .m--ev { padding-left: calc(var(--pad) * 1.35 * var(--u) + 5 * var(--u)); padding-right: calc(var(--pad) * 1.35 * var(--u)); }
  @keyframes ev-glow { 50% { box-shadow: inset calc(5 * var(--u)) 0 0 var(--acc), 0 0 calc(44 * var(--u)) var(--acc-g); } }
  .m__cap {
    display: inline-block; margin-right: .5em; padding: .08em .5em .1em; border-radius: .4em; vertical-align: .08em;
    font-size: .64em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    color: #12141c; background: var(--acc); text-shadow: none;
  }
  .mode-list .m__cap { display: table; margin: 0 0 .25em; }
  /* эффекты сообщений Twitch (за баллы) */
  .m--fx .m__text {
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bff95, #6bc8ff, #c56bff, #ff6b6b); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: fx 4s linear infinite; text-shadow: none;
  }
  @keyframes fx { to { background-position: 300% 0; } }

  /* ---------- колонка ---------- */
  .mode-list .feed { flex-direction: column; justify-content: flex-end; align-items: flex-start; }
  .mode-list.dir-down .feed { justify-content: flex-start; }
  .mode-list.align-right .feed { align-items: flex-end; }
  .mode-list.align-right .m { text-align: right; }

  /* ---------- строка ---------- */
  .mode-row .feed { flex-direction: row; align-items: center; justify-content: flex-end; }
  .mode-row.from-left .feed { justify-content: flex-start; }
  .mode-row .m { white-space: nowrap; max-width: 62%; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- летающий ---------- */
  .mode-fly .feed { display: block; }
  .mode-fly .m { position: absolute; left: 0; top: 0; white-space: nowrap; max-width: none; will-change: transform; }

  /* ---------- новости ---------- */
  .tk {
    position: absolute; inset: 0; display: flex; align-items: stretch; overflow: hidden;
    font-size: calc(var(--fs) * var(--u)); font-weight: var(--w); background: var(--bg); border-radius: calc(var(--rad) * var(--u));
  }
  .bg-none .tk { background: transparent; }
  .tk__label {
    position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: .55em; padding: 0 1em 0 .9em;
    background: var(--tkl); color: #fff; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
  }
  .tk__label::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 100%; width: .9em; background: var(--tkl);
    clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  .tk__dot { width: .48em; height: .48em; border-radius: 50%; background: #fff; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tk__view { position: relative; flex: 1; overflow: hidden; }
  .mode-ticker .m {
    position: absolute; left: 0; top: 50%; white-space: nowrap; max-width: none; background: transparent;
    padding: .12em .2em; will-change: transform; display: flex; align-items: center;
  }
  .mode-ticker .m::before {
    content: ""; flex: 0 0 auto; width: .42em; height: .42em; margin-right: 1em; transform: rotate(45deg); background: var(--tkl);
  }
  .mode-ticker .m--ev { background: linear-gradient(90deg, var(--acc-a), var(--acc-a)); border-radius: .3em; padding: .12em .5em; animation: none; box-shadow: none; }
  .mode-ticker .m--ev::before { background: var(--acc); }
  .tk__idle { opacity: .7; font-style: italic; }
  .tk__clock {
    position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; padding: 0 .9em;
    font-weight: 700; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.4); color: #fff;
  }

  /* ---------- алерты ---------- */
  .alerts {
    position: absolute; inset: 0; z-index: 5; pointer-events: none; display: flex; flex-direction: column; align-items: center;
    padding: 7vh 4vw; justify-content: flex-start;
  }
  .alerts.pos-center { justify-content: center; }
  .alerts.pos-bottom { justify-content: flex-end; padding-bottom: 12vh; }
  .al { position: relative; text-align: center; max-width: 80vw; font-family: var(--font); color: #fff; }
  .al__text { font-size: calc(68 * var(--u) * var(--as)); font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
  .al__sub { font-size: calc(32 * var(--u) * var(--as)); font-weight: 600; margin-top: .35em; opacity: .95; overflow-wrap: anywhere; }
  .al__msg { font-size: calc(26 * var(--u) * var(--as)); font-weight: 500; margin-top: .45em; opacity: .9; max-width: 50em; margin-left: auto; margin-right: auto; overflow-wrap: anywhere; }
  .al .emote { height: 1.4em; }

  /* вспышка: лучи, искры, текст выпрыгивает */
  .al--burst { animation: al-pop .75s cubic-bezier(.2,1.6,.4,1) both; }
  .al--burst::before {
    content: ""; position: absolute; inset: -40% -18%; z-index: -2;
    background: radial-gradient(ellipse closest-side, rgba(4,6,14,.6), rgba(4,6,14,.28) 60%, transparent);
  }
  .al--burst .al__text { text-shadow: 0 0 .25em var(--acc), 0 0 .7em var(--acc-g), 0 .06em 0 rgba(0,0,0,.6); }
  .al--burst .al__sub { color: var(--acc); }
  .al__rays {
    position: absolute; left: 50%; top: 50%; z-index: -1; width: calc(1000 * var(--u) * var(--as)); height: calc(1000 * var(--u) * var(--as));
    margin: calc(-500 * var(--u) * var(--as)) 0 0 calc(-500 * var(--u) * var(--as));
    background: repeating-conic-gradient(from 0deg, var(--acc-a) 0deg 7deg, transparent 7deg 20deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%); mask-image: radial-gradient(circle, #000 12%, transparent 62%);
    animation: rays-in .9s ease-out both, spin 14s linear infinite;
  }
  @keyframes rays-in { from { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .al__p {
    position: absolute; left: 50%; top: 50%; width: calc(14 * var(--u)); height: calc(14 * var(--u)); border-radius: calc(3 * var(--u));
    background: var(--c, var(--acc)); opacity: 0; animation: spark 1.3s cubic-bezier(.1,.7,.3,1) var(--d, 0s) forwards;
  }
  @keyframes spark {
    0% { opacity: 1; transform: translate(-50%, -50%) rotate(0) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(.4); }
  }
  @keyframes al-pop { 0% { opacity: 0; transform: scale(.3); } 100% { opacity: 1; transform: none; } }
  .al--burst.is-out { animation: al-out .55s ease-in forwards; }
  @keyframes al-out { to { opacity: 0; transform: scale(1.25); filter: blur(calc(6 * var(--u))); } }

  /* плашка: выезжает слева с цветной полосой */
  .al--banner {
    display: flex; align-items: stretch; text-align: left; overflow: hidden; border-radius: calc(18 * var(--u) * var(--as));
    background: rgba(10,12,20,.9); box-shadow: 0 0 calc(40 * var(--u)) var(--acc-g), 0 calc(10 * var(--u)) calc(40 * var(--u)) rgba(0,0,0,.5);
    animation: ban-in .65s cubic-bezier(.2,.9,.2,1) both;
  }
  .al__stripe { flex: 0 0 auto; width: calc(12 * var(--u) * var(--as)); background: var(--acc); }
  .al__body { padding: calc(20 * var(--u) * var(--as)) calc(36 * var(--u) * var(--as)) calc(22 * var(--u) * var(--as)); }
  .al--banner .al__text { font-size: calc(46 * var(--u) * var(--as)); }
  .al--banner .al__sub { font-size: calc(28 * var(--u) * var(--as)); color: var(--acc); margin-top: .2em; }
  .al--banner .al__msg { font-size: calc(24 * var(--u) * var(--as)); margin-left: 0; }
  .al--banner::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); transform: translateX(-100%);
    animation: shine 1.4s .5s ease-in-out;
  }
  @keyframes shine { to { transform: translateX(100%); } }
  @keyframes ban-in { from { opacity: 0; transform: translateX(-30vw) skewX(-8deg); } }
  .al--banner.is-out { animation: ban-out .5s ease-in forwards; }
  @keyframes ban-out { to { opacity: 0; transform: translateX(30vw) skewX(8deg); } }

  /* неон: буквы падают по одной и светятся */
  .al--neon .al__text .ch {
    display: inline-block; white-space: pre; color: #fff;
    text-shadow: 0 0 .06em #fff, 0 0 .25em var(--acc), 0 0 .7em var(--acc), 0 0 1.3em var(--acc-g);
    animation: ch-in .55s cubic-bezier(.2,1.6,.4,1) calc(var(--i) * 45ms) both, flicker 2.6s ease-in-out calc(var(--i) * 45ms + .6s) infinite;
  }
  @keyframes ch-in { from { opacity: 0; transform: translateY(-1em) scale(1.4); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 50% { opacity: .55; } 53% { opacity: 1; } }
  .al--neon .al__sub, .al--neon .al__msg { animation: fade-up .6s ease .5s both; }
  .al--neon .al__sub { color: var(--acc); text-shadow: 0 0 .4em var(--acc-g); }
  @keyframes fade-up { from { opacity: 0; transform: translateY(.6em); } }
  .al--neon.is-out { animation: al-out .55s ease-in forwards; }

  /* ---------- предпросмотр ---------- */
  body.demo-busy {
    background:
      radial-gradient(circle at 18% 30%, rgba(255,120,80,.55), transparent 32%),
      radial-gradient(circle at 75% 25%, rgba(90,160,255,.55), transparent 35%),
      radial-gradient(circle at 60% 80%, rgba(120,255,170,.4), transparent 35%),
      radial-gradient(circle at 30% 85%, rgba(250,220,120,.5), transparent 30%),
      linear-gradient(135deg, #39405c, #1b2033);
  }
  body.demo-dark { background: #0d1120; }
  body.demo-light { background: linear-gradient(135deg, #e9edf5, #c9d3e6); }
  .frame {
    position: absolute; z-index: 10; border: calc(3 * var(--u)) dashed rgba(250,199,117,.9); border-radius: calc(6 * var(--u));
    cursor: move; touch-action: none; background: rgba(250,199,117,.05);
  }
  .frame__tag {
    position: absolute; left: -3px; bottom: 100%; margin-bottom: calc(6 * var(--u)); padding: calc(6 * var(--u)) calc(14 * var(--u));
    border-radius: calc(8 * var(--u)); background: #FAC775; color: #14110a; font: 700 calc(22 * var(--u)) "Segoe UI", sans-serif; white-space: nowrap;
  }
  .frame.is-low .frame__tag { bottom: auto; top: 100%; margin: calc(6 * var(--u)) 0 0; }
  .frame__h { position: absolute; width: calc(34 * var(--u)); height: calc(34 * var(--u)); background: #FAC775; border-radius: 50%; border: calc(4 * var(--u)) solid #14110a; }
  .frame__h[data-h="nw"] { left: calc(-17 * var(--u)); top: calc(-17 * var(--u)); cursor: nwse-resize; }
  .frame__h[data-h="ne"] { right: calc(-17 * var(--u)); top: calc(-17 * var(--u)); cursor: nesw-resize; }
  .frame__h[data-h="sw"] { left: calc(-17 * var(--u)); bottom: calc(-17 * var(--u)); cursor: nesw-resize; }
  .frame__h[data-h="se"] { right: calc(-17 * var(--u)); bottom: calc(-17 * var(--u)); cursor: nwse-resize; }
  .size-warn {
    position: absolute; left: 1rem; bottom: 1rem; z-index: 20; max-width: 40rem; padding: .6rem .9rem; border-radius: .5rem;
    background: rgba(120, 20, 30, .9); color: #fff; font: 600 16px/1.4 "Segoe UI", sans-serif; transition: opacity 1s ease;
  }
</style>
</head>
<body>
<div class="area" id="area"><div class="feed" id="feed"></div></div>
<div class="alerts" id="alerts"></div>

<script src="chat-kit.js?v=2"></script>
<script>
(function () {
'use strict';

// ===================== параметры =====================
const qs = new URLSearchParams(location.search);
const EMBED = qs.has('embed');            // предпросмотр в админке
const DEMO = qs.has('demo') || EMBED;     // ненастоящий чат
// Версия страницы. Менять при каждой правке chat.html или chat-kit.js (и ?v= у chat-kit.js):
// OBS держит копию страницы до 10 минут, а так оверлей сам замечает новую версию и перезагружается.
const VERSION = '2026-11-20.4';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const U = () => innerWidth / 1920; // один «пиксель» 1080p в точках экрана
const area = $('area'), feed = $('feed'), alertsBox = $('alerts');

let S = ChatKit.overlay({});                                         // настройки этого оверлея
let EV = ChatKit.read({}).events;                                     // настройки событий
let channel = (qs.get('channel') || '').toLowerCase().replace(/^#/, '');
let mode = null;

// ===================== цвета =====================
function rgb(hex) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return [250, 199, 117];
  const h = m[1].length === 3 ? m[1].replace(/./g, c => c + c) : m[1];
  const n = parseInt(h, 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}
const rgba = (hex, a) => `rgba(${rgb(hex).join(',')},${a})`;
function setAcc(el, hex) {
  el.style.setProperty('--acc', rgba(hex, 1));
  el.style.setProperty('--acc-a', rgba(hex, 0.3));
  el.style.setProperty('--acc-g', rgba(hex, 0.5));
}

// ===================== применить настройки =====================
const loadedFonts = new Set();
function loadFont(id) {
  const f = ChatKit.FONTS.find(x => x[0] === id) || ChatKit.FONTS[0];
  if (f[3] && !loadedFonts.has(f[0])) {
    loadedFonts.add(f[0]);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + f[3] + '&display=swap';
    document.head.appendChild(l);
  }
  return f[2];
}

function apply(next, events) {
  const prevMode = mode;
  S = next;
  if (events) EV = events;
  // свои звуки грузим заранее, чтобы алерт не ждал файл
  if (S.alerts && S.volume > 0) Object.values(EV).forEach(ev => { if (ev.on && ev.alert && String(ev.sound).includes('/')) soundFile(ev.sound); });
  const r = document.documentElement.style;
  r.setProperty('--fs', S.size);
  r.setProperty('--w', S.weight);
  r.setProperty('--nw', S.nickWeight);
  r.setProperty('--rad', S.radius);
  r.setProperty('--pad', S.pad);
  r.setProperty('--gap', S.gap);
  r.setProperty('--alpha', Math.max(0.2, S.alpha / 100));
  r.setProperty('--as', S.alertScale / 100);
  r.setProperty('--tc', S.color);
  r.setProperty('--bg', rgba(S.bgColor, S.bgAlpha / 100));
  r.setProperty('--tkl', S.tickerLabelColor);
  r.setProperty('--font', loadFont(S.font));
  setAcc(document.documentElement, S.accent);

  Object.assign(area.style, { left: S.x + '%', top: S.y + '%', width: S.w + '%', height: S.h + '%' });
  area.className = ['area', 'mode-' + S.mode, 'bg-' + S.bgMode, 'lay-' + S.layout, 'dir-' + S.dir, 'align-' + S.align,
    'from-' + S.rowFrom, S.outline ? 'outline' : ''].join(' ');
  area.hidden = S.mode === 'alerts';
  alertsBox.className = 'alerts pos-' + S.alertPos + (S.outline ? ' outline' : '');

  if (S.mode !== prevMode) {
    mode = S.mode;
    clearFeed();
    if (mode === 'ticker') tkBuild();
  }
  if (mode === 'ticker' && tk) {
    tk.label.hidden = !S.tickerLabel;
    tk.labelText.textContent = S.tickerLabel;
    tk.clock.hidden = !S.tickerClock;
  }
  if (mode === 'fly') flyLayout();
  frameSync();
}

function clearFeed() {
  feed.innerHTML = '';
  flyQ.length = 0;
  if (tk) { tk.root.remove(); tk = null; }
}

// ===================== сообщение =====================
const BADGE_SVG = {
  broadcaster: '<path d="M4 6h11a2 2 0 0 1 2 2v1.5l4-2.5v10l-4-2.5V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>',
  moderator: '<path d="M14.5 2 22 2 22 9.5 12.6 18.9l1.7 1.7-1.4 1.4-3.2-3.2-3.3 3.3a1.5 1.5 0 0 1-2.1-2.1l3.3-3.3-3.2-3.2 1.4-1.4 1.7 1.7z"/>',
  vip: '<path d="M6 3h12l4 6-10 12L2 9z"/>',
  sub: '<path d="m12 2 2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.9 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/>',
};
function badgesHTML(tags) {
  if (!S.badges) return '';

    case 'drop': return [{ opacity: 0, transform: `translateY(${-d}px)` }, { opacity: 1, transform: 'none' }];

}

// Остальные сообщения плавно съезжают на новое место (FLIP)

  kids.forEach(k => {
    if (!k.isConnected) return;
    const b = before.get(k), a = k.getBoundingClientRect();
    const dx = b.left - a.left, dy = b.top - a.top;

}

  const f = inFrames();
  if (f) el.animate(f, { duration: S.animMs, easing: ease });

}
// Лишние и ушедшие за край — убираем без анимации (их и так не видно)
function prune(first) {

  const extra = kids.length - S.max;
  const old = first ? kids.slice().reverse() : kids;
  for (let i = 0; i < extra; i++) drop(old[i]);
  const box = feed.getBoundingClientRect();
  [...feed.children].forEach(k => {
    const r = k.getBoundingClientRect();
    const out = mode === 'list' ? (r.bottom < box.top - 2 || r.top > box.bottom + 2) : (r.right < box.left - 2 || r.left > box.right + 2);
    if (out) drop(k);

}

  const f = animate && outFrames();
  let done = false;
  const finish = () => { if (done) return; done = true; flip(() => el.remove()); };
  if (f) { el.animate(f, { duration: S.animMs, easing: 'ease-in', fill: 'forwards' }).onfinish = finish; setTimeout(finish, S.animMs + 150); }
  else finish();

const flyQ = [];

  // Чат пишет быстрее ленты: разгоняемся по длине очереди (за ~4 с её съесть), но не больше чем в 2.5 раза,
  // чат затих — плавно возвращаемся к обычной скорости
  let want = base;

function fillHTML(tpl, vars, html) {

    const m = /^\{(\w+)\}$/.exec(part);
    if (!m) return esc(part);

  if (!ev || !ev.on || (ev.min && (n || 0) < ev.min)) return plain();
  const vars = Object.assign({ nick: base.nick || '', n: n == null ? '' : n, msg: base.text || '' }, extra);
  if (mode !== 'alerts') {
    if (S.highlights && ev.hl) pushChat(Object.assign({}, base, { cap: ChatKit.fill(ev.cap, vars), acc: ev.color, sys: !base.html }));
    else plain();

  if (S.alerts && ev.alert && alertMine()) {
    const hv = { msg: base.html || '' };
    queueAlert({ anim: ev.anim, color: ev.color, sound: ev.sound, dur: ev.dur,
      text: fillHTML(ev.text, vars, hv), sub: fillHTML(ev.sub, vars, hv), plainText: ChatKit.fill(ev.text, vars) });
  }
}

// ===================== алерты =====================
// Несколько оверлеев с алертами в одном OBS: алерт рисует только один. Оверлеи перекликаются через
// BroadcastChannel; приоритет у того, что сейчас в эфире (OBS сообщает obsSourceActiveChanged),
// не в эфире — молчит. OBS ещё не сказал — средний приоритет. Ничего не слышно от других — показываем сами.
const INST = Math.random().toString(36).slice(2, 10);
let obsActive = null;
let bc = null;
const peers = new Map();
const alertRank = () => (obsActive === true ? 2 : obsActive === false ? 0 : 1);
function heartbeat() { if (bc) bc.postMessage({ inst: INST, alerts: !!S.alerts, rank: alertRank() }); }
if (!DEMO && 'BroadcastChannel' in window) {
  bc = new BroadcastChannel('chatkit-alerts');
  bc.onmessage = e => {
    const d = e.data;
    if (!d || !d.inst || d.inst === INST) return;
    if (d.bye) peers.delete(d.inst);
    else peers.set(d.inst, { alerts: d.alerts, rank: d.rank, at: Date.now() });
  };
  setInterval(heartbeat, 2000);

}
addEventListener('obsSourceActiveChanged', e => { obsActive = !!(e.detail && e.detail.active); heartbeat(); });

  if (!bc) return true;

  const now = Date.now();
  for (const [id, p] of peers) {
    if (now - p.at > 5000) { peers.delete(id); continue; }
    if (!p.alerts || p.rank === 0) continue;
    if (p.rank > me || (p.rank === me && id < INST)) return false;
  }

}

let actx = null;

const audioCache = new Map();

function sound(kind) {

    } catch (e) { /* без звука */ }

  }
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + 0.02;
    const master = actx.createGain();
    master.gain.value = S.volume / 100 * 0.5;

      o.type = type || 'sine';

      gn.gain.setValueAtTime(0.0001, t + at);
      gn.gain.linearRampToValueAtTime(g, t + at + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + at + len);
      o.connect(gn); gn.connect(master);
      o.start(t + at); o.stop(t + at + len + 0.05);
    };
    if (kind === 'chime') { note(1318.5, 0, 1.0, 'sine', 0.55); note(1975.5, 0.13, 1.2, 'sine', 0.4); note(2637, 0.26, 1.0, 'sine', 0.18); }
    else if (kind === 'pop') { note(880, 0, 0.16, 'sine', 0.8, 260); note(1760, 0.05, 0.12, 'triangle', 0.25, 900); }
    else if (kind === 'fanfare') {

      note(1046.5, 0.33, 1.1, 'triangle', 0.5); note(1318.5, 0.33, 1.1, 'sine', 0.22); note(783.99, 0.33, 1.1, 'sine', 0.2);

}

      if (!tok) return '';
      if (opts && opts.bits && CHEER.test(tok)) return '';
      if (S.emotes && ext.has(tok)) return img(ext.get(tok));
      return esc(tok);
    }).join('');
    buf = '';
  };
  while (i < chars.length && len < max) {
    const e = at[i];
    if (e) {
      flush();
      lastEmote = out.length;
      out += img(`https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(e.id)}/default/dark/2.0`);
      i = e.end + 1; len += 2;
    } else { buf += chars[i]; i++; len++; }
  }
  flush();
  // «гигантский смайл» за баллы — последний смайл крупно
  if (opts && opts.giant && lastEmote >= 0) out = out.slice(0, lastEmote) + out.slice(lastEmote).replace('class="emote"', 'class="emote emote--giant"');
  return out.trim() + (i < chars.length ? '…' : '');
}

// Цвет ника из Twitch, но не темнее, чем читается на тёмной плашке
function nickColor(hex, login) {
  let h, s, l;
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (m) {
    const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    l = (mx + mn) / 2;
    s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    h = !d ? 0 : mx === r ? 60 * (((g - b) / d) % 6) : mx === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
  } else {
    h = [...String(login || 'x')].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7); s = 0.7; l = 0.7;
  }
  return `hsl(${Math.round((h + 360) % 360)}, ${Math.round(Math.min(s, 0.9) * 100)}%, ${Math.round(Math.max(l, 0.66) * 100)}%)`;
}

// ===================== чат Twitch (анонимно, только чтение) =====================
let ws = null, wsChan = '', reconnectDelay = 1000;
function connect() {
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) { /* уже закрыт */ } }
  wsChan = channel;
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
    ws.send('JOIN #' + wsChan);
  };
  ws.onmessage = ev => ev.data.split('\r\n').forEach(line => { if (line) onLine(line); });
  ws.onclose = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
  ws.onerror = () => { try { ws.close(); } catch (e) { /* закроется сам */ } };
}
function parseTags(raw) {
  const tags = {};
  raw.split(';').forEach(pair => {
    const i = pair.indexOf('=');
    tags[i < 0 ? pair : pair.slice(0, i)] = i < 0 ? '' : pair.slice(i + 1).replace(/\\s/g, ' ').replace(/\\:/g, ';').replace(/\\\\/g, '\\');
  });
  return tags;
}
function onLine(line) {
  if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; }
  let tags = {}, rest = line, prefix = '';
  if (rest[0] === '@') { const sp = rest.indexOf(' '); tags = parseTags(rest.slice(1, sp)); rest = rest.slice(sp + 1); }
  if (rest[0] === ':') { const sp = rest.indexOf(' '); prefix = rest.slice(1, sp); rest = rest.slice(sp + 1); }
  const sp = rest.indexOf(' ');
  const cmd = sp < 0 ? rest : rest.slice(0, sp);
  const params = sp < 0 ? '' : rest.slice(sp + 1);
  const text = params.includes(' :') ? params.slice(params.indexOf(' :') + 2) : '';
  if (cmd === '001') { reconnectDelay = 1000; return; }
  if (cmd === 'RECONNECT') { try { ws.close(); } catch (e) { /* переподключимся */ } return; }
  if (cmd === 'ROOMSTATE') { loadEmotes(tags['room-id']); return; }
  if (cmd === 'CLEARMSG') { dropWhere(el => el.dataset.id === tags['target-msg-id']); return; }
  if (cmd === 'CLEARCHAT') { const who = text.trim().toLowerCase(); dropWhere(el => !who || el.dataset.login === who); return; }
  if (cmd === 'PRIVMSG') onChat(tags, prefix.split('!')[0].toLowerCase(), text);
  else if (cmd === 'USERNOTICE') onNotice(tags, text);
}

const LINK = /(https?:\/\/|www\.)\S+|\b[\w-]+\.(ru|com|tv|net|org|gg|ly|io|me|su|xyz|info|рф)\b/i;
const ignored = login => String(S.ignore || '').toLowerCase().split(/[\s,;]+/).filter(Boolean).includes(login);
function baseMsg(tags, login, text, opts) {
  const nick = tags['display-name'] || login;
  return {
    id: tags.id, login, nick, text: text.slice(0, 300),
    color: nickColor(tags.color, login), badges: badgesHTML(tags),
    html: text ? renderText(text, tags.emotes, opts) : '',
    fx: !!tags['animation-id'],
  };
}
function onChat(tags, login, raw) {
  let text = raw;
  const action = /^\u0001ACTION (.*)\u0001$/.exec(text);
  if (action) text = action[1];
  const bits = parseInt(tags.bits, 10) || 0;
  if (!bits) {
    if (ignored(login) || !text.trim()) return;
    if (S.hideCmd && text.trim()[0] === '!') return;
    if (S.hideLinks && LINK.test(text)) return;
  }
  const kind = tags['msg-id'];
  const m = baseMsg(tags, login, text, { bits: bits > 0, giant: kind === 'gigantified-emote-message' });
  if (bits) return onEvent('bits', m, bits);
  if (kind === 'highlighted-message') return onEvent('highlight', m);
  if (tags['custom-reward-id']) return onEvent('reward', m);
  if (tags['first-msg'] === '1') return onEvent('first', m);
  pushChat(m);
}

const mysteryGifts = new Set();
const TIERS = { Prime: 'Prime', 1000: '1', 2000: '2', 3000: '3' };
function onNotice(tags, text) {
  const id = tags['msg-id'];
  const login = (tags.login || '').toLowerCase();
  const p = k => tags['msg-param-' + k] || '';
  const m = baseMsg(tags, login, text || '');
  const tier = TIERS[p('sub-plan')] || '';
  if (id === 'sub') onEvent('sub', m, 1, { tier });
  else if (id === 'resub') onEvent('resub', m, parseInt(p('cumulative-months'), 10) || 0, { tier });
  else if (id === 'submysterygift') {
    if (p('community-gift-id')) mysteryGifts.add(p('community-gift-id'));
    onEvent('gift', m, parseInt(p('mass-gift-count'), 10) || 1, { tier });
  } else if (id === 'subgift') {
    if (p('community-gift-id') && mysteryGifts.has(p('community-gift-id'))) return; // часть пачки — алерт уже был
    onEvent('gift', m, 1, { to: p('recipient-display-name'), tier });
  } else if (id === 'raid') {
    m.nick = p('displayName') || m.nick;
    onEvent('raid', m, parseInt(p('viewerCount'), 10) || 0);
  } else if (id === 'viewermilestone' && p('category') === 'watch-streak') {
    onEvent('streak', m, parseInt(p('value'), 10) || 0);
  } else if (id === 'announcement') {
    onEvent('announce', m);
  }
}

// ===================== предпросмотр =====================
const NICKS = [['Lunatik_77', '#FF4500', 'moderator/1'], ['kotofey', '#1E90FF', 'subscriber/12'], ['Nyashka', '#FF69B4', 'vip/1'], ['dedinside', '', ''],
  ['Barmaley', '#9ACD32', 'subscriber/3'], ['night_owl', '#8A2BE2', ''], ['PetrovichTV', '#DAA520', 'subscriber/24'], ['pariparikai', '#FAC775', 'broadcaster/1']];
const LINES = ['привет!', 'всем ку', 'ну наконец-то', 'это было больно смотреть', 'го дальше', 'лол', 'ахахахах', 'чат, вы видели это?',
  'стример, ты лучший', 'а что за игра?', 'добрый вечер', 'зашёл на огонёк', 'я с работы, что пропустил?', 'кринж', 'красиво',
  'он сейчас опять упадёт', 'ставлю сотку что не пройдёт', 'это уже классика', 'GG', 'чай налит, я готов смотреть дальше'];
function fakeTags(nick, color, badges) {
  return { 'display-name': nick, color, badges, 'badge-info': badges.startsWith('subscriber') ? badges : '', id: String(Math.random()) };
}
function fakeChat() {
  const [nick, color, badges] = pick(NICKS);
  onChat(fakeTags(nick, color, badges), nick.toLowerCase(), pick(LINES));
}
const FAKE_N = { streak: 50, resub: 14, gift: 5, raid: 42, bits: 500 };
function fakeEvent(id) {
  const [nick, color, badges] = pick(NICKS.slice(0, 7));
  const tags = fakeTags(nick, color, badges);
  const withText = ['streak', 'first', 'resub', 'bits', 'highlight', 'reward', 'announce'].includes(id);
  const m = baseMsg(tags, nick.toLowerCase(), withText ? pick(LINES) : '');
  const ev = EV[id];
  onEvent(id, m, Math.max(FAKE_N[id] || 1, ev ? ev.min || 0 : 0), { to: 'kotofey', tier: '1' });
}
function demo() {
  document.body.classList.add('demo-' + (qs.get('bg') || 'busy'));
  const tick = () => {
    if (mode !== 'alerts') fakeChat();
    setTimeout(tick, rand(600, 2000) * (mode === 'fly' ? 0.6 : 1));
  };
  tick();
  // в отдельном предпросмотре — сами по себе события раз в 15 секунд; в админке — по кнопкам
  if (!EMBED) {
    let k = 0;
    setInterval(() => { const ids = ChatKit.EVENTS.map(e => e.id).filter(id => EV[id].on); if (ids.length) fakeEvent(ids[k++ % ids.length]); }, 15000);
  }
}

// ===================== рамка области (только в админке) =====================
let frame = null;
function frameSync() {
  if (!EMBED) return;
  if (!frame) {
    frame = document.createElement('div');
    frame.className = 'frame';
    frame.innerHTML = '<span class="frame__tag">Тащи рамку или углы</span>' + ['nw', 'ne', 'sw', 'se'].map(h => `<i class="frame__h" data-h="${h}"></i>`).join('');
    document.body.appendChild(frame);
    frame.addEventListener('pointerdown', frameDown);
  }
  frame.hidden = S.mode === 'alerts' || qs.get('frame') === '0';
  Object.assign(frame.style, { left: S.x + '%', top: S.y + '%', width: S.w + '%', height: S.h + '%' });
  frame.classList.toggle('is-low', S.y < 6);
}
function frameDown(e) {
  e.preventDefault();
  const h = e.target.dataset.h || 'move';
  const start = { x: e.clientX, y: e.clientY, a: { x: S.x, y: S.y, w: S.w, h: S.h } };
  const r1 = v => Math.round(v * 2) / 2;
  const move = ev => {
    const dx = (ev.clientX - start.x) / innerWidth * 100, dy = (ev.clientY - start.y) / innerHeight * 100;
    const a = Object.assign({}, start.a);
    if (h === 'move') { a.x += dx; a.y += dy; } // форма та же, рамка только едет
    else {
      if (h.includes('w')) { a.x += dx; a.w -= dx; }
      if (h.includes('e')) a.w += dx;
      if (h.includes('n')) { a.y += dy; a.h -= dy; }
      if (h.includes('s')) a.h += dy;
    }
    a.w = Math.max(3, Math.min(100, a.w)); a.h = Math.max(3, Math.min(100, a.h));
    a.x = Math.max(0, Math.min(100 - a.w, a.x)); a.y = Math.max(0, Math.min(100 - a.h, a.y));
    Object.keys(a).forEach(k => { a[k] = r1(a[k]); });
    apply(Object.assign({}, S, a));
    parent.postMessage({ type: 'chatkit:area', area: a }, location.origin);
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
}

// ===================== настройки с сайта =====================
async function loadJSON(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ': ' + r.status);
  return r.json();
}
async function loadSettings() {
  let c = null, d = null;
  try { c = await loadJSON('data/config.json'); } catch (e) { /* канал по умолчанию */ }
  try { d = await loadJSON('data/chat.json'); } catch (e) { console.warn('Нет настроек чата, работаю на умолчаниях', e); }
  if (c && !qs.get('channel')) {
    const kv = Object.fromEntries((c.items || []).map(r => [r.key, r.value]));
    const m = String(kv.streamer_twitch_url || '').match(/twitch\.tv\/([\w]+)/i);
    if (m) channel = m[1].toLowerCase();
  }
  if (!channel) channel = 'pariparikai';
  if (d) {
    const all = ChatKit.read(d);
    const o = all.overlays.find(x => x.id === qs.get('o')) || all.overlays[0];
    apply(o || ChatKit.overlay({}), all.events);
  } else if (!mode) apply(S, EV);
}

// Свежая копия с сайта (мимо кэша) с другой VERSION — перезагружаемся с меткой в адресе, которой нет в кэше
async function checkVersion() {
  if (location.protocol === 'file:' || EMBED) return;
  try {
    const html = await (await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })).text();
    const m = /const VERSION = '([^']+)'/.exec(html);
    if (!m || m[1] === VERSION) return;
    if (Date.now() - (+qs.get('_v') || 0) < 120000) return;
    qs.set('_v', Date.now());
    location.replace(location.pathname + '?' + qs.toString());
  } catch (e) { /* сайт недоступен — работаем на том, что есть */ }
}
function checkSize() {
  if (EMBED || !innerHeight || Math.abs(innerWidth / innerHeight / (16 / 9) - 1) < 0.03) return;
  const el = document.createElement('div');
  el.className = 'size-warn';
  el.textContent = `Размер источника ${innerWidth}×${innerHeight}, картинка растянется. В свойствах источника поставь 1920 × 1080, ` +
    'потом ПКМ по источнику → Преобразование → Сбросить преобразование.';
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 1200); }, 30000);
}

// Настройки из админки — сразу, без сохранения
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  const d = e.data;
  if (d.type === 'chatkit:set') soundUrls = d.sounds || {};
  if (d.type === 'chatkit:set') apply(ChatKit.overlay(d.overlay), Object.fromEntries(ChatKit.EVENTS.map(x => [x.id, ChatKit.event(x.id, d.events && d.events[x.id])])));
  if (d.type === 'chatkit:test') fakeEvent(d.event);
  if (d.type === 'chatkit:clear') { mode = null; apply(S); alertsBox.innerHTML = ''; alertQ.length = 0; alertOn = false; }
});
addEventListener('resize', () => { if (mode === 'fly') flyLayout(); });

// ===================== запуск =====================
checkSize();
checkVersion();
setInterval(checkVersion, 5 * 60000);
if (EMBED) {
  apply(S, EV);
  demo();
  parent.postMessage({ type: 'chatkit:ready' }, location.origin);
} else {
  loadSettings().then(() => {
    if (DEMO) demo(); else connect();
    setInterval(loadSettings, 30000);
    setInterval(() => { if (!DEMO && channel !== wsChan) connect(); }, 60000);
  });
}
})();
