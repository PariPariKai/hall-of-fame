<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Рулетка выбора — Hall of Fame</title>

<!-- ============================================================
     ⚙ НАСТРОЙКА ⚙
     Четыре списка заказов + зрители (аватарки) — data/*.json, правятся на admin.html.
     ============================================================ -->
<script>
  // Какие источники и статусы включены при открытии, слово для сбора
  // из чата — в админке: «Настройки» → «Рулетки» (wheel-kit.js, picker_*)
  const SOURCES = [
    { id:'anime',  name:'Аниме',   icon:'torii', color:'#E58CC0', csv: 'data/anime.json' },
    { id:'movies', name:'Фильмы',  icon:'film', color:'#FAC775', csv: 'data/movies.json' },
    { id:'series', name:'Сериалы', icon:'tv', color:'#6FB7E8', csv: 'data/series.json' },
    { id:'games',  name:'Игры',    icon:'gamepad', color:'#9B8CE8', csv: 'data/games.json' },
  ];

  const VIEWERS_CSV_URL = 'data/viewers.json';

  // Сбор участников из чата: заказчик пишет одно из этих слов —
  // и его заказы попадают на колесо. Слово должно стоять первым
  // («я», «Я!», «я хочу» — да; «ясно» — нет).
  let JOIN_WORDS = ['я'];   // заменяется словами из админки

  // Статусы из колонки status. Всё непонятное считаем «ещё не смотрели».
  const STATUSES = [
    { id:'pending',  name:'Ещё не смотрели', icon:'○' },
    { id:'watching', name:'Сейчас смотрим',  icon:'◐' },
    { id:'watched',  name:'Уже посмотрели',  icon:'●' },
  ];

  // Тип берётся из колонки type (фильмы: movie/youtube/other)
  // или format (аниме: sub/dub). Список строится по тому, что реально
  // есть в таблицах, — незнакомое значение просто покажется как есть.
  const TYPE_LABELS = {
    // icon — имя SVG-иконки из site.js
    movie:   { name:'Фильм',    icon:'film' },
    youtube: { name:'YouTube',  icon:'play' },
    other:   { name:'Другое',   icon:'square' },
    sub:     { name:'Субтитры', icon:'message' },
    dub:     { name:'Озвучка',  icon:'mic' },
    '':      { name:'Без типа', icon:'x' },
  };
</script>

<link rel="stylesheet" href="core/theme.css?v=1">
<link rel="stylesheet" href="core/nav.css?v=1">
<link rel="stylesheet" href="modules/picker/picker.page.css?v=2">
<link rel="stylesheet" href="kits/wheel-kit.css?v=2">
</head>

<body>

<!-- ===== ОБЩЕЕ МЕНЮ: выпадающие разделы (одинаково на всех страницах) ===== -->
<script src="core/core.js?v=1"></script><script src="core/site.js?v=20"></script>
<script src="kits/wheel-kit.js?v=4"></script>

<div class="wrap">

  <div class="header">
    <h1 class="title"><svg class="ic" aria-hidden="true"><use href="#i-dice"></use></svg> Рулетка выбора</h1>
    <p class="subtitle" id="top-stats">Загрузка…</p>
  </div>

  <div class="layout">

    <!-- ===== Фильтры ===== -->
    <div class="side-left wheel-side">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Сбор из чата</div></div>
        <button class="ctrl-btn primary collect-btn" id="btn-collect"></button>
        <div class="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">Чат не подключён</span></div>
        <div class="collect-hint" id="collect-hint"></div>
        <div class="collect-feed" id="collect-feed"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><div class="panel-title">Источники</div></div>
        <div id="sources-list"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><div class="panel-title">Статус</div></div>
        <div id="status-list"></div>
      </div>

      <div class="panel" id="types-panel" style="display:none">
        <div class="panel-head"><div class="panel-title">Тип</div></div>
        <div id="types-list"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">Заказчики</div>
          <div class="panel-actions">
            <button class="mini-btn" id="who-all">все</button>
            <button class="mini-btn" id="who-none">никого</button>
          </div>
        </div>
        <input type="text" class="people-search" id="who-search" placeholder="Поиск по нику…">
        <div class="people-list" id="people-list"></div>
      </div>
    </div>

    <!-- ===== Колесо ===== -->
    <div class="wheel-col">
      <div class="wheel-area">
        <svg class="wheel-svg" id="wheel" viewBox="0 0 100 100"></svg>
        <div class="wheel-pointer" id="wheel-pointer"></div>
        <div class="wheel-empty" id="wheel-empty">Выбери источники слева —<br>варианты появятся на колесе</div>
      </div>

      <div class="controls">
        <div class="duration-group">
          <span class="duration-label"><svg class="ic" aria-hidden="true"><use href="#i-timer"></use></svg></span>
          <button class="duration-btn" data-dur="3">3с</button>
          <button class="duration-btn active" data-dur="5">5с</button>
          <button class="duration-btn" data-dur="10">10с</button>
          <button class="duration-btn" data-dur="60">60с</button>
        </div>
        <div class="duration-group sound-group" title="Звук щелчка стрелки (нажми — услышишь)">
          <span class="duration-label"><svg class="ic" aria-hidden="true"><use href="#i-volume"></use></svg></span>
          <button class="duration-btn" data-sound="wood">Дерево</button>
          <button class="duration-btn" data-sound="soft">Мягкий</button>
          <button class="duration-btn" data-sound="ball">Шарик</button>
          <button class="duration-btn" data-sound="off">Выкл</button>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn primary" id="btn-single"><svg class="ic" aria-hidden="true"><use href="#i-target"></use></svg> Один победитель</button>
        <button class="ctrl-btn primary" id="btn-elim"><svg class="ic" aria-hidden="true"><use href="#i-swords"></use></svg> Режим выбывания</button>
        <button class="ctrl-btn auto" id="btn-auto"><svg class="ic" aria-hidden="true"><use href="#i-bot"></use></svg> Авто-выбывание</button>
        <button class="ctrl-btn danger" id="btn-reset">↺ Сброс</button>
        <button class="ctrl-btn" id="btn-reload"><svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg> Перезагрузить</button>
      </div>
    </div>

    <!-- ===== История ===== -->
    <div class="side-right wheel-side">
      <div class="panel log" id="log">
        <div class="panel-head"><div class="panel-title">История</div></div>
        <div id="log-entries"></div>
      </div>
    </div>

  </div>
</div>

<div class="confetti-container" id="confetti"></div>

<div class="winner-overlay" id="winner-overlay">
  <div class="winner-card">
    <div class="winner-label">✦ Выбрано ✦</div>
    <div class="winner-cat" id="winner-cat"></div>
    <img class="winner-cover" id="winner-cover" alt="" referrerpolicy="no-referrer">
    <div class="winner-title" id="winner-title"></div>
    <div class="winner-who">
      <span class="winner-who-ava" id="winner-who-ava"></span>
      <span id="winner-who-text"></span>
    </div>
    <a class="winner-link" id="winner-link" target="_blank" rel="noopener noreferrer">открыть страницу ↗</a>
    <br>
    <button class="ctrl-btn winner-close" id="winner-close-btn">Закрыть</button>
  </div>
</div>

<script src="modules/picker/picker.page.js?v=1"></script>
</body>
</html>
