<title>Рулетка выбора — Hall of Fame</title>

<!-- ============================================================
     ⚙ НАСТРОЙКА ⚙
     Четыре списка заказов + зрители (аватарки) — data/*.json, правятся на admin.html.
     ============================================================ -->
<script>
  // on — включён ли источник при открытии страницы
  const SOURCES = [
    { id:'anime',  name:'Аниме',   icon:'torii', color:'#E58CC0', on:true,  csv: 'data/anime.json' },
    { id:'movies', name:'Фильмы',  icon:'film', color:'#FAC775', on:true,  csv: 'data/movies.json' },
    { id:'series', name:'Сериалы', icon:'tv', color:'#6FB7E8', on:true,  csv: 'data/series.json' },
    { id:'games',  name:'Игры',    icon:'gamepad', color:'#9B8CE8', on:false, csv: 'data/games.json' },
  ];

  const VIEWERS_CSV_URL = 'data/viewers.json';

  // Сбор участников из чата: заказчик пишет одно из этих слов —
  // и его заказы попадают на колесо. Слово должно стоять первым
  // («я», «Я!», «я хочу» — да; «ясно» — нет).
  const TWITCH_CHANNEL = 'pariparikai';
  const JOIN_WORDS = ['я'];

  // Статусы из колонки status. Всё непонятное считаем «ещё не смотрели».
  // on — включён ли статус при открытии: по умолчанию только «ещё не смотрели».
  const STATUSES = [
    { id:'pending',  name:'Ещё не смотрели', icon:'○', on:true  },
    { id:'watching', name:'Сейчас смотрим',  icon:'◐', on:false },
    { id:'watched',  name:'Уже посмотрели',  icon:'●', on:false },
  ];

  // Тип берётся из колонки type (фильмы: movie/youtube/other)
  // или format (аниме: sub/dub). Список строится по тому, что реально
  // есть в таблицах, — незнакомое значение просто покажется как есть.
  const TYPE_LABELS = {
    // icon — имя SVG-иконки из site.js
    movie:   { name:'Фильм',    icon:'film' },
    youtube: { name:'YouTube',  icon:'play' },
    other:   { name:'Другое',   icon:'square' },
    sub:     { name:'Субтитры', icon:'message' },
    dub:     { name:'Озвучка',  icon:'mic' },
    '':      { name:'Без типа', icon:'x' },
  };
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e1a;
    background-image:
      radial-gradient(ellipse at top left, rgba(var(--gold-rgb, 250, 199, 117), 0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(127, 119, 221, 0.06), transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    padding: 0 20px 40px;
  }

  /* ========== ОБЩЕЕ ВЕРХНЕЕ МЕНЮ ========== */
  .site-nav {
    position: sticky; top: 0; z-index: 100;
    margin: 0 -20px 24px;
    background: rgba(20, 25, 40, 0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .site-nav__inner {
    max-width: 1400px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .site-nav__brand {
    font-size: 13px; letter-spacing: 3px; color: var(--gold, #FAC775);
    text-decoration: none; text-transform: uppercase;
    text-shadow: 0 0 8px rgba(var(--gold-rgb, 250, 199, 117),0.25); flex: 0 0 auto;
  }
  .site-nav__links { display: flex; list-style: none; margin: 0; padding: 0; gap: 22px; flex-wrap: wrap; }
  .site-nav__links a {
    color: rgba(255,255,255,0.7); text-decoration: none;
    font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 4px 0; border-bottom: 2px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease, text-shadow 0.2s ease;
  }
  .site-nav__links a:hover { color: var(--gold, #FAC775); }
  .site-nav__links a.is-active {
    color: var(--gold, #FAC775); border-bottom-color: var(--gold, #FAC775);
    text-shadow: 0 0 8px rgba(var(--gold-rgb, 250, 199, 117),0.5);
  }
  @media (max-width: 720px) {
    .site-nav__inner { padding: 10px 16px; gap: 12px; justify-content: center; }
    .site-nav__brand { display: none; }
    .site-nav__links { gap: 14px; justify-content: center; }
    .site-nav__links a { font-size: 12px; letter-spacing: 1px; }
  }
  @media (max-width: 480px) {
    .site-nav__links { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; padding-bottom: 4px; }
    .site-nav__links::-webkit-scrollbar { height: 0; display: none; }
    .site-nav__links li { flex: 0 0 auto; }
  }

  /* ========== СТРАНИЦА ========== */
  .wrap { max-width: 1400px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 22px; }
  .title {
    font-size: 30px; font-weight: 500; letter-spacing: 4px;
    color: var(--gold, #FAC775); text-shadow: 0 0 20px rgba(var(--gold-rgb, 250, 199, 117),0.4);
    margin-bottom: 6px; text-transform: uppercase;
  }
  .subtitle { font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
  .subtitle b { color: #fff; font-weight: 600; }

  .layout {
    display: grid; grid-template-columns: 280px minmax(0, 1fr) 340px;
    gap: 18px; align-items: start;
  }

  /* ========== ПАНЕЛИ ФИЛЬТРОВ ========== */
  .panel {
    background: rgba(20, 25, 40, 0.72);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 13px; margin-bottom: 13px;
    backdrop-filter: blur(10px);
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .panel-title {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--gold, #FAC775); font-weight: 600;
  }
  .panel-actions { display: flex; gap: 5px; }
  .mini-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.45); border-radius: 6px;
    padding: 3px 8px; font-family: inherit; font-size: 10px;
    cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
  }
  .mini-btn:hover { color: var(--gold, #FAC775); border-color: var(--gold, #FAC775); }

  .row {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 7px; border-radius: 8px;
    cursor: pointer; user-select: none; transition: background 0.13s ease;
  }
  .row:hover { background: rgba(255,255,255,0.05); }
  .box {
    width: 15px; height: 15px; border-radius: 4px; flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.3); background: transparent;
    position: relative; transition: all 0.15s ease;
  }
  .row.on .box { background: var(--sw, var(--gold, #FAC775)); border-color: var(--sw, var(--gold, #FAC775)); }
  .row.on .box::after {
    content: ''; position: absolute; left: 4px; top: 0.5px;
    width: 4px; height: 8px;
    border: solid #0a0e1a; border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .row-label { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-count { font-size: 11px; color: rgba(255,255,255,0.35); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .row.off .row-label, .row.off .row-count { opacity: 0.42; }
  .row-ava {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    background-size: cover; background-position: center;
    background-color: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .src-status { font-size: 10.5px; color: rgba(255,255,255,0.3); padding: 0 7px 4px 31px; }
  .src-status.err { color: #f2a0a0; }

  .people-list { max-height: 400px; overflow-y: auto; margin: 0 -3px; padding: 0 3px; }
  .people-search {
    width: 100%; padding: 8px 11px; font-size: 12.5px; margin-bottom: 8px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; color: #fff; font-family: inherit; outline: none;
    transition: border-color 0.15s ease;
  }
  .people-search:focus { border-color: var(--gold, #FAC775); }
  .people-search::placeholder { color: rgba(255,255,255,0.3); }
  .empty-note { font-size: 12px; color: rgba(255,255,255,0.35); padding: 9px 7px; line-height: 1.5; }
  @keyframes rowJoin { from { background: rgba(151,196,89,0.35); } to { background: transparent; } }
  .row.joined { animation: rowJoin 2.5s ease-out; }

  /* ========== СБОР ИЗ ЧАТА ========== */
  .collect-btn { width: 100%; }
  .collect-btn.running { background: rgba(151,196,89,0.14); border-color: #97C459; color: #97C459; }
  .conn-status {
    display: flex; align-items: center; gap: 8px;
    margin-top: 9px; font-size: 11.5px; color: rgba(255,255,255,0.5);
  }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,255,255,0.25);
  }
  .conn-dot.connecting { background: var(--gold, #FAC775); box-shadow: 0 0 8px rgba(var(--gold-rgb, 250, 199, 117),0.6); }
  .conn-dot.online { background: #97C459; box-shadow: 0 0 8px rgba(151,196,89,0.6); }
  .conn-dot.error { background: #F09595; box-shadow: 0 0 8px rgba(240,149,149,0.6); }
  .collect-hint { font-size: 11.5px; color: rgba(255,255,255,0.38); line-height: 1.5; margin-top: 8px; }
  .collect-hint b { color: var(--gold, #FAC775); font-weight: 600; }
  .collect-feed { margin-top: 8px; max-height: 190px; overflow-y: auto; }
  .collect-line {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; padding: 4px 2px; color: rgba(255,255,255,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .collect-line:last-child { border-bottom: none; }
  .collect-line .ic { flex: 0 0 auto; }
  .collect-line .nick { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .collect-line .why { font-size: 10.5px; flex: 0 0 auto; }
  .collect-line.in { color: #97C459; }
  .collect-line.in .nick { color: #fff; }

  /* ========== КОЛЕСО ========== */
  /* Цвета обода, ступицы и стрелки. Зимой (site.js → .season-winter) — лёд вместо золота */
  :root {
    --rim-1: #fff3cf; --rim-2: #e2ad4f; --rim-3: #6e4a12; --rim-4: #f6d58a;
    --ptr-1: #fff1c4; --ptr-2: #f2bf5e; --ptr-3: #9a6516;
    --gem-1: #ffffff; --gem-2: #ffb36b; --gem-3: #b34b12;
  }
  .season-winter {
    --rim-1: #f4fbff; --rim-2: #9ccbf2; --rim-3: #23406c; --rim-4: #c9e6ff;
    --ptr-1: #ffffff; --ptr-2: #a9dcff; --ptr-3: #3b6fa8;
    --gem-1: #ffffff; --gem-2: #8fd3ff; --gem-3: #1f5fae;
  }

  /* Колонка колеса под боковыми панелями: блёстки не лезут на фильтры */
  .wheel-col { display: flex; flex-direction: column; align-items: center; min-width: 0; position: relative; z-index: 0; }
  .side-left, .side-right { position: relative; z-index: 1; }
  .wrap { overflow-x: clip; }
  .wheel-area { position: relative; width: 100%; max-width: 620px; aspect-ratio: 1 / 1; margin: 10px 0 26px; }
  .wheel-svg {
    position: relative; z-index: 1; width: 100%; height: 100%; display: block; overflow: visible;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,0.6)) drop-shadow(0 0 28px rgba(var(--ember-rgb, 255, 140, 80), 0.22));
  }
  /* «Масло» с блёстками вокруг колеса — холст больше колеса на 30% с каждой стороны */
  .wheel-fx { position: absolute; left: -30%; top: -30%; width: 160%; height: 160%; z-index: 0; pointer-events: none; }
  @keyframes segFlash { 0%,100% { opacity: 0; } 25%,65% { opacity: 0.8; } 45% { opacity: 0.35; } }
  .seg-flash { animation: segFlash 0.65s ease-in-out forwards; pointer-events: none; }

  .wheel-pointer {
    position: absolute; right: -10px; top: 50%;
    transform: translateY(-50%);
    width: 64px; height: 56px; z-index: 10;
    filter: drop-shadow(-4px 5px 7px rgba(0,0,0,0.65)) drop-shadow(0 0 10px rgba(var(--ember-rgb, 255, 140, 80), 0.35));
    transform-origin: 88% 50%; transition: transform 0.05s ease-out;
  }
  .wheel-pointer svg { width: 100%; height: 100%; }
  /* Колесо идёт по часовой — справа край уезжает вниз и тянет кончик стрелки за собой */
  @keyframes pointerTick {
    0%   { transform: translateY(-50%) rotate(0deg); }
    30%  { transform: translateY(-50%) rotate(-16deg); }
    100% { transform: translateY(-50%) rotate(0deg); }
  }
  .wheel-pointer.ticking { animation: pointerTick 0.18s ease-out; }

  .wheel-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 40px; color: rgba(255,255,255,0.35); font-size: 14px; line-height: 1.6;
  }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .ctrl-btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.86); padding: 11px 20px;
    font-family: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; border-radius: 11px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 4px 14px rgba(0,0,0,0.25);
    transition: background .15s ease, border-color .15s ease, box-shadow .2s ease, transform .15s ease;
  }
  .ctrl-btn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04)); border-color: rgba(255,255,255,0.3); transform: translateY(-1px); }
  .ctrl-btn:active:not(:disabled) { transform: translateY(0); }
  .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .ctrl-btn.primary {
    border-color: rgba(var(--gold-rgb, 250, 199, 117),0.5); color: var(--gold, #FAC775);
    background: linear-gradient(180deg, rgba(var(--gold-rgb, 250, 199, 117),0.18), rgba(var(--gold-rgb, 250, 199, 117),0.05));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 18px rgba(var(--ember-rgb, 255, 140, 80),0.14);
  }
  .ctrl-btn.primary:hover:not(:disabled) {
    border-color: var(--gold, #FAC775);
    background: linear-gradient(180deg, rgba(var(--gold-rgb, 250, 199, 117),0.28), rgba(var(--gold-rgb, 250, 199, 117),0.08));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 0 26px rgba(var(--ember-rgb, 255, 140, 80),0.3);
  }
  .ctrl-btn.danger { border-color: rgba(240,149,149,0.3); color: #f2c4c4; }

  .duration-group {
    display: flex; align-items: center; gap: 5px;
    background: rgba(8, 14, 28, 0.55); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 11px; padding: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .duration-label { font-size: 11px; color: rgba(255,255,255,0.35); padding: 0 6px; }
  .duration-btn {
    background: transparent; border: none; color: rgba(255,255,255,0.55);
    padding: 6px 11px; font-family: inherit; font-size: 12.5px;
    border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
  }
  .duration-btn.active { background: rgba(var(--gold-rgb, 250, 199, 117),0.18); color: var(--gold, #FAC775); }
  .duration-btn:hover:not(.active):not(:disabled) { color: #fff; }
  .duration-btn:disabled { cursor: not-allowed; }
  .duration-btn:disabled:not(.active) { opacity: 0.4; }

  .sound-group .duration-btn.active { background: rgba(151,196,89,0.18); color: #97C459; }
  .sound-group .duration-btn[data-sound="off"].active { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

  .ctrl-btn.auto { border-color: rgba(151,196,89,0.45); color: #97C459; }
  .ctrl-btn.auto:hover:not(:disabled) { background: rgba(151,196,89,0.12); border-color: #97C459; }
  .ctrl-btn.auto.running { background: rgba(151,196,89,0.16); border-color: #97C459; }

  /* ========== ИСТОРИЯ ========== */
  /* Без своей прокрутки: список растёт вниз вместе со страницей.
     Самый свежий вылет — сверху, крупнее и жирнее остальных. */
  .log { display: none; }
  .log.has-entries { display: block; }
  .log-entry {
    font-size: 15px; line-height: 1.35; padding: 8px 9px; color: rgba(255,255,255,0.72);
    border-bottom: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .num { color: rgba(255,255,255,0.3); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .log-who { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 2px; }
  .log-entry.latest { font-size: 19px; font-weight: 700; color: #fff; padding: 11px 10px; }
  .log-entry.latest .log-who { font-size: 13px; font-weight: 500; }
  .log-entry.winner { color: var(--gold, #FAC775); font-weight: 700; }
  @keyframes logPop {
    0%{transform:scale(1.5);opacity:0;background:rgba(var(--gold-rgb, 250, 199, 117),0.3)}
    100%{transform:scale(1);background:transparent}
  }
  .log-entry.fresh { animation: logPop 1s cubic-bezier(0.22,1.2,0.36,1) both; transform-origin: center left; }

  /* ========== ПОБЕДИТЕЛЬ ========== */
  .winner-overlay {
    position: fixed; inset: 0; background: rgba(4,6,14,0.9);
    display: none; align-items: center; justify-content: center;
    z-index: 200; flex-direction: column; backdrop-filter: blur(10px);
  }
  .winner-overlay.show { display: flex; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .winner-card {
    text-align: center; padding: 46px 62px; border-radius: 20px;
    background: linear-gradient(180deg, #161c2e 0%, #0c1120 100%);
    border: 3px solid var(--gold, #FAC775); position: relative;
    max-width: min(92vw, 720px); max-height: 92vh; overflow-y: auto;
    animation: winIn 0.55s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 0 60px rgba(var(--gold-rgb, 250, 199, 117),0.35), 0 0 140px rgba(var(--gold-rgb, 250, 199, 117),0.15);
  }
  @keyframes winIn { from{transform:scale(0.6) rotateY(150deg);opacity:0} to{transform:scale(1) rotateY(0);opacity:1} }
  .winner-label {
    font-size: 15px; letter-spacing: 6px; color: var(--gold, #FAC775);
    text-transform: uppercase; margin-bottom: 18px;
    text-shadow: 0 0 18px rgba(var(--gold-rgb, 250, 199, 117),0.55);
  }
  .winner-cat {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 15px; border-radius: 999px; margin-bottom: 16px;
    font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16);
  }
  .winner-cover {
    display: none; max-height: 250px; max-width: 180px;
    border-radius: 12px; margin: 0 auto 18px;
    border: 2px solid rgba(var(--gold-rgb, 250, 199, 117),0.4);
    box-shadow: 0 14px 36px rgba(0,0,0,0.6);
  }
  .winner-cover.show { display: block; }
  .winner-title {
    font-size: 38px; color: #fff; font-weight: 600; line-height: 1.2;
    margin-bottom: 14px; text-shadow: 0 0 20px rgba(var(--gold-rgb, 250, 199, 117),0.45);
    word-break: break-word;
  }
  .winner-who {
    font-size: 15px; color: rgba(255,255,255,0.7);
    display: inline-flex; align-items: center; gap: 9px;
  }
  .winner-who-ava {
    width: 30px; height: 30px; border-radius: 50%;
    background-size: cover; background-position: center;
    background-color: rgba(255,255,255,0.1);
    border: 1px solid rgba(var(--gold-rgb, 250, 199, 117),0.4); display: none;
  }
  .winner-who-ava.show { display: block; }
  .winner-link {
    display: none; margin-top: 14px; font-size: 13px; color: var(--gold, #FAC775);
    text-decoration: none; border-bottom: 1px dashed rgba(var(--gold-rgb, 250, 199, 117),0.5);
  }
  .winner-link.show { display: inline-block; }
  .winner-link:hover { color: #fff; border-color: #fff; }
  .winner-close { margin-top: 26px; padding: 12px 28px !important; }

  .confetti-container { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 199; display: none; }

<script>
// ============================================================
// Утилиты
// ============================================================
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { cell += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { cell += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c === '\r') {}
      else { cell += c; }
    }
  }
  if (cell.length > 0 || row.length > 0) {
    row.push(cell);
    if (row.some(c => c.length > 0)) rows.push(row);
  }
  return rows;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function pluralize(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

// ============================================================
// Разбор таблиц
// ============================================================
const TITLE_HINTS  = ['title','название','назва','тайтл','фильм','аниме','сериал','игра','name'];
const WHO_HINTS    = ['nick','заказчик','заказ','ник','зритель','user','кто','автор'];
const STATUS_HINTS = ['status','статус'];
const TYPE_HINTS   = ['type','format','формат','тип'];
const COVER_HINTS  = ['cover','обложка','постер','poster'];
const LINK_HINTS   = ['url','ссылка','link'];

function findCol(headers, hints) {
  for (let i = 0; i < headers.length; i++) {
    for (const hint of hints) if (headers[i].indexOf(hint) >= 0) return i;
  }
  return -1;
}

// Приводим статус к одному из трёх. Пустое и незнакомое = «ещё не смотрели».
function normStatus(raw) {
  const s = (raw || '').trim().toLowerCase();
  if (s.indexOf('watched') >= 0 || s.indexOf('смотрел') >= 0 || s.indexOf('готов') >= 0) return 'watched';
  if (s.indexOf('watching') >= 0 || s.indexOf('смотрим') >= 0 || s.indexOf('процесс') >= 0) return 'watching';
  return 'pending';
}

function rowsToItems(rows, source) {
  if (rows.length < 1) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  let titleIdx  = findCol(headers, TITLE_HINTS);
  let whoIdx    = findCol(headers, WHO_HINTS);
  const statIdx = findCol(headers, STATUS_HINTS);
  const typeIdx = findCol(headers, TYPE_HINTS);
  // cover_url тоже содержит 'url', поэтому обложку ищем раньше ссылки
  const coverIdx = findCol(headers, COVER_HINTS);
  let linkIdx = -1;
  for (let i = 0; i < headers.length; i++) {
    if (i === coverIdx) continue;
    if (LINK_HINTS.some(h => headers[i].indexOf(h) >= 0)) { linkIdx = i; break; }
  }
  if (titleIdx < 0) titleIdx = 0;
  if (whoIdx < 0)   whoIdx = headers.length > 1 ? 1 : -1;

  const cell = (r, i) => (i >= 0 && r[i] ? r[i].trim() : '');

  return rows.slice(1)
    .filter(r => cell(r, titleIdx))
    .map(r => ({
      title:  cell(r, titleIdx),
      who:    cell(r, whoIdx),
      status: normStatus(cell(r, statIdx)),
      type:   cell(r, typeIdx).toLowerCase(),
      cover:  cell(r, coverIdx),
      link:   cell(r, linkIdx),
      source: source.id,
    }));
}

// ============================================================
// Загрузка
// ============================================================
let allItems = [];
let viewers = {};                 // ник (lowercase) → {nick, avatar}
const srcState = {};

// Google иногда отдаёт опубликованный лист по минуте и дольше.
// Без таймаута зависший запрос держит страницу бесконечно.
async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function loadSource(source) {
  const st = srcState[source.id];
  try {
    const items = rowsToItems(parseCSV(await siteData.text(source.csv, { signal: AbortSignal.timeout(20000) })), source);
    st.note = '';
    return items;
  } catch (e) {
    st.note = 'ошибка загрузки';
    st.error = true;
    return [];
  }
}

async function loadViewers() {
  try {
    const res = await siteData.fetch(VIEWERS_CSV_URL, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) return false;
    const rows = parseCSV(await res.text());
    if (rows.length < 2) return false;
    const h = rows[0].map(x => x.trim().toLowerCase());
    const nickIdx = h.indexOf('nick') >= 0 ? h.indexOf('nick') : 0;
    const avaIdx  = findCol(h, ['avatar','аватар']);
    rows.slice(1).forEach(r => {
      const n = (r[nickIdx] || '').trim();
      if (!n) return;
      viewers[n.toLowerCase()] = { nick: n, avatar: avaIdx >= 0 ? (r[avaIdx] || '').trim() : '' };
    });
    return true;
  } catch (e) { /* аватарки не критичны */ }
  return false;
}

function avatarOf(nick) {
  const v = viewers[(nick || '').toLowerCase()];
  return v && /^https?:\/\//i.test(v.avatar) ? v.avatar : '';
}

async function loadAll() {
  SOURCES.forEach(s => { if (!srcState[s.id]) srcState[s.id] = { on: s.on !== false }; srcState[s.id].error = false; });
  STATUSES.forEach(s => { if (!(s.id in statState)) statState[s.id] = s.on; });

  // Аватарки — украшение, и лежат они в отдельном листе, который
  // Google порой отдаёт по минуте. Не держим из-за них колесо:
  // грузим параллельно и дорисовываем, когда придут.
  loadViewers().then(ok => { if (ok) renderPeople(); });

  const lists = await Promise.all(SOURCES.map(loadSource));

  allItems = [];
  SOURCES.forEach((s, i) => {
    srcState[s.id].count = lists[i].length;
    allItems = allItems.concat(lists[i]);
  });

  const known = new Set(allItems.map(i => i.who).filter(Boolean));
  Object.keys(whoState).forEach(k => { if (!known.has(k)) delete whoState[k]; });
  // Заказчики при открытии сняты: на колесо их добавляет сбор из чата
  // или галочки вручную. Новые после «Перезагрузить» — тоже сняты.
  known.forEach(w => { if (!(w in whoState)) whoState[w] = false; });

  renderSources();
  renderStatuses();
  renderTypes();
  renderPeople();
  rebuildWheel();
}

// ============================================================
// Фильтры
// ============================================================
const whoState = {};
const statState = {};
const typeState = {};
let whoQuery = '';

function visibleItems() {
  return allItems.filter(it =>
    srcState[it.source] && srcState[it.source].on &&
    statState[it.status] !== false &&
    typeState[it.type] !== false &&
    (!it.who || whoState[it.who] !== false)
  );
}

function typeLabel(t) {
  return TYPE_LABELS[t] || { name: t, icon: 'square' };
}

function srcById(id) { return SOURCES.find(s => s.id === id); }

// Слегка меняем яркость цвета источника, чтобы соседние сектора отличались
function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const clamp = v => Math.max(0, Math.min(255, v));
  const r = clamp(((n >> 16) & 255) + amount);
  const g = clamp(((n >> 8) & 255) + amount);
  const b = clamp((n & 255) + amount);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function renderSources() {
  document.getElementById('sources-list').innerHTML = SOURCES.map(s => {
    const st = srcState[s.id];
    const note = st.note ? `<div class="src-status${st.error ? ' err' : ''}">${esc(st.note)}</div>` : '';
    return `
      <div class="row ${st.on ? 'on' : 'off'}" data-src="${s.id}" style="--sw:${s.color}">
        <span class="box"></span>
        <span class="row-label" style="color:${s.color}">${icon(s.icon)} ${esc(s.name)}</span>
        <span class="row-count">${st.count != null ? st.count : '—'}</span>
      </div>${note}`;
  }).join('');

  document.querySelectorAll('[data-src]').forEach(el => {
    el.addEventListener('click', () => {
      srcState[el.dataset.src].on = !srcState[el.dataset.src].on;
      renderSources(); renderStatuses(); renderTypes(); renderPeople(); rebuildWheel();
    });
  });
}

function renderStatuses() {
  const counts = {};
  allItems.forEach(it => {
    if (!srcState[it.source] || !srcState[it.source].on) return;
    counts[it.status] = (counts[it.status] || 0) + 1;
  });
  document.getElementById('status-list').innerHTML = STATUSES.map(s => `
    <div class="row ${statState[s.id] !== false ? 'on' : 'off'}" data-stat="${s.id}">
      <span class="box"></span>
      <span class="row-label">${s.icon} ${esc(s.name)}</span>
      <span class="row-count">${counts[s.id] || 0}</span>
    </div>`).join('');

  document.querySelectorAll('[data-stat]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.stat;
      statState[id] = statState[id] === false;
      renderStatuses(); renderTypes(); renderPeople(); rebuildWheel();
    });
  });
}

// Типы строим по тому, что реально есть в включённых источниках.
// Панель прячется, если типов нет вообще (например, остались только игры).
function renderTypes() {
  const counts = {};
  allItems.forEach(it => {
    if (!srcState[it.source] || !srcState[it.source].on) return;
    if (statState[it.status] === false) return;
    counts[it.type] = (counts[it.type] || 0) + 1;
  });
  const keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const panel = document.getElementById('types-panel');

  // Один-единственный тип фильтровать не по чему — прячем панель
  if (keys.length < 2) { panel.style.display = 'none'; return; }
  panel.style.display = '';

  document.getElementById('types-list').innerHTML = keys.map(t => {
    const L = typeLabel(t);
    return `
      <div class="row ${typeState[t] !== false ? 'on' : 'off'}" data-type="${esc(t)}">
        <span class="box"></span>
        <span class="row-label">${icon(L.icon)} ${esc(L.name)}</span>
        <span class="row-count">${counts[t]}</span>
      </div>`;
  }).join('');

  document.querySelectorAll('[data-type]').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.dataset.type;
      typeState[t] = typeState[t] === false;
      renderTypes(); renderPeople(); rebuildWheel();
    });
  });
}

function renderPeople() {
  const counts = {};
  allItems.forEach(it => {
    if (!it.who) return;
    if (!srcState[it.source] || !srcState[it.source].on) return;
    if (statState[it.status] === false) return;
    if (typeState[it.type] === false) return;
    counts[it.who] = (counts[it.who] || 0) + 1;
  });
  // Во время сбора записавшиеся поднимаются наверх — сразу видно, кто в игре
  const onFirst = (a, b) => collecting ? (whoState[b] !== false) - (whoState[a] !== false) : 0;
  let names = Object.keys(counts).sort((a, b) => onFirst(a, b) || counts[b] - counts[a] || a.localeCompare(b, 'ru'));
  if (whoQuery) names = names.filter(n => n.toLowerCase().indexOf(whoQuery) >= 0);

  const list = document.getElementById('people-list');
  if (names.length === 0) {
    list.innerHTML = `<div class="empty-note">${whoQuery ? 'Никого не нашли' : 'Выбери источник — здесь появятся заказчики'}</div>`;
    return;
  }
  list.innerHTML = names.map(n => {
    const ava = avatarOf(n);
    return `
      <div class="row ${whoState[n] !== false ? 'on' : 'off'}${justJoined.has(n.toLowerCase()) ? ' joined' : ''}" data-who="${esc(n)}">
        <span class="box"></span>
        <span class="row-ava" ${ava ? `style="background-image:url('${esc(ava)}')"` : ''}></span>
        <span class="row-label">${esc(n)}</span>
        <span class="row-count">${counts[n]}</span>
      </div>`;
  }).join('');

  list.querySelectorAll('[data-who]').forEach(el => {
    el.addEventListener('click', () => {
      const n = el.dataset.who;
      whoState[n] = whoState[n] === false;
      renderPeople(); rebuildWheel();
    });
  });
}

// ============================================================
// Сбор участников из чата Twitch
//
// Анонимное подключение к IRC-чату (только чтение, без логина).
// «Собрать» снимает всех заказчиков, дальше каждый, кто написал
// «я», включается сам. Первая крутка закрывает сбор — иначе
// пересборка колеса посреди выбывания сбросила бы его.
// ============================================================
let collecting = false;
let chatWs = null, chatReconnect = null, chatDelay = 1000;
const justJoined = new Set();        // подсветка только что записавшихся (lowercase)
const chatSeen = new Set();          // кто уже писал «я» в этом сборе (login)

function setConnStatus(state, text) {
  document.getElementById('conn-dot').className = 'conn-dot' + (state ? ' ' + state : '');
  document.getElementById('conn-text').textContent = text;
}

function updateCollectUi() {
  const btn = document.getElementById('btn-collect');
  btn.classList.toggle('running', collecting);
  btn.innerHTML = collecting ? icon('stop') + ' Закрыть сбор' : icon('message') + ' Собрать из чата';
  const words = JOIN_WORDS.map(w => `<b>«${esc(w)}»</b>`).join(' или ');
  document.getElementById('collect-hint').innerHTML = collecting
    ? `Заказчики пишут ${words} в чат — и их заказы появляются на колесе. Первая крутка закроет сбор.`
    : `Снимет всех заказчиков и будет добавлять тех, кто напишет ${words} в чат #${esc(TWITCH_CHANNEL)}.`;
}

function addCollectLine(name, ok, why) {
  const feed = document.getElementById('collect-feed');
  const line = document.createElement('div');
  line.className = 'collect-line' + (ok ? ' in' : '');
  line.innerHTML = `${icon(ok ? 'check' : 'x')}<span class="nick">${esc(name)}</span><span class="why">${esc(why)}</span>`;
  feed.prepend(line);
}

function closeChat() {
  if (chatReconnect) { clearTimeout(chatReconnect); chatReconnect = null; }
  if (!chatWs) return;
  chatWs.onopen = chatWs.onmessage = chatWs.onclose = chatWs.onerror = null;
  try { chatWs.close(); } catch (e) {}
  chatWs = null;
}

function openChat() {
  closeChat();
  setConnStatus('connecting', 'Подключение к чату…');
  const ws = chatWs = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
    ws.send('JOIN #' + TWITCH_CHANNEL);
  };
  ws.onmessage = ev => ev.data.split('\r\n').forEach(line => { if (line) handleChatLine(line); });
  ws.onclose = () => {
    if (!collecting) return;
    setConnStatus('connecting', 'Переподключение…');
    chatReconnect = setTimeout(openChat, chatDelay);
    chatDelay = Math.min(chatDelay * 2, 15000);
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

function handleChatLine(line) {
  if (line.startsWith('PING')) { chatWs.send('PONG :tmi.twitch.tv'); return; }
  let tags = '', rest = line;
  if (rest[0] === '@') { const sp = rest.indexOf(' '); tags = rest.slice(1, sp); rest = rest.slice(sp + 1); }
  let prefix = '';
  if (rest[0] === ':') { const sp = rest.indexOf(' '); prefix = rest.slice(1, sp); rest = rest.slice(sp + 1); }
  const sp = rest.indexOf(' ');
  const command = sp < 0 ? rest : rest.slice(0, sp);
  const params = sp < 0 ? '' : rest.slice(sp + 1);

  if (command === 'JOIN') {
    chatDelay = 1000;
    setConnStatus('online', 'Слушаю чат #' + TWITCH_CHANNEL);
  } else if (command === 'RECONNECT') {
    try { chatWs.close(); } catch (e) {}
  } else if (command === 'PRIVMSG') {
    const login = prefix.split('!')[0].toLowerCase();
    const m = /(?:^|;)display-name=([^;]*)/.exec(tags);
    const name = (m && m[1].replace(/\\s/g, ' ')) || login;
    const i = params.indexOf(' :');
    onChatMessage(login, name, i < 0 ? '' : params.slice(i + 2));
  }
}

function isJoinMessage(text) {
  // ACTION (/me) приходит обёрнутым в \x01 — снимаем обёртку
  const t = text.replace(/^\x01ACTION |\x01$/g, '').trim().toLowerCase();
  const first = (t.split(/\s+/)[0] || '').replace(/[!?.,:;)+]+$/, '');
  return JOIN_WORDS.some(w => first === w.toLowerCase());
}

function onChatMessage(login, name, text) {
  if (!collecting || !isJoinMessage(text) || chatSeen.has(login)) return;
  chatSeen.add(login);

  // Ник в таблицах записан как придётся (SI_ve / Si_ve) — сравниваем без регистра
  const keys = Object.keys(whoState).filter(k => k.toLowerCase().replace(/^@/, '') === login);
  if (!keys.length) { addCollectLine(name, false, 'нет заказов'); return; }

  keys.forEach(k => whoState[k] = true);
  const n = visibleItems().filter(it => it.who && it.who.toLowerCase() === login).length;
  addCollectLine(name, n > 0, n > 0 ? n + ' ' + pluralize(n, 'заказ', 'заказа', 'заказов') : 'нет заказов в фильтре');

  justJoined.add(login);
  setTimeout(() => justJoined.delete(login), 2500);
  renderPeople(); rebuildWheel();
}

function startCollect() {
  collecting = true;
  chatSeen.clear();
  document.getElementById('collect-feed').innerHTML = '';
  hideWinner();
  Object.keys(whoState).forEach(k => whoState[k] = false);
  renderPeople(); rebuildWheel();
  updateCollectUi();
  chatDelay = 1000;
  openChat();
}

function stopCollect(reason) {
  if (!collecting) return;
  collecting = false;
  closeChat();
  const n = document.querySelectorAll('#collect-feed .collect-line.in').length;
  setConnStatus('', (reason || 'Сбор закрыт') + ` · записались: ${n}`);
  updateCollectUi();
  renderPeople();
}

document.getElementById('btn-collect').addEventListener('click', () => {
  if (collecting) stopCollect(); else startCollect();
});
updateCollectUi();

document.getElementById('who-search').addEventListener('input', e => {
  whoQuery = e.target.value.trim().toLowerCase();
  renderPeople();
});
document.getElementById('who-all').addEventListener('click', () => {
  Object.keys(whoState).forEach(k => whoState[k] = true);
  renderPeople(); rebuildWheel();
});
document.getElementById('who-none').addEventListener('click', () => {
  Object.keys(whoState).forEach(k => whoState[k] = false);
  renderPeople(); rebuildWheel();
});

// ============================================================
// Состояние колеса
// ============================================================
let activeItems = [];
let currentSegments = [];
let labelCache = [];
let currentRotation = 0;
let liveRotation = 0;       // угол колеса прямо сейчас, по кадрам анимации — по нему движутся блёстки
let isSpinning = false;
let duration = 5;
let eliminationMode = false;
let autoRunning = false;
let wheelGen = 0;          // растёт при пересборке колеса — старая крутка результат не применяет
let log = [];

// Когда вариантов мало, каждый получает несколько тонких кусочков
// вперемешку: шансы те же, но по колесу не предугадать результат
const SPLIT_BELOW = 10;
const MIN_SLICE_ANGLE = 4;
const MAX_PARTS = 6;   // шире сектор — больше влезает в подпись

function rebuildWheel() {
  wheelGen++;
  stopAuto();
  activeItems = visibleItems();
  setEliminationUi(false);
  log = [];
  document.getElementById('log-entries').innerHTML = '';
  document.getElementById('log').classList.remove('has-entries');
  currentRotation = 0;
  renderWheel();
  updateStats();
}

function updateStats() {
  const total = activeItems.length;
  const bySrc = SOURCES.filter(s => srcState[s.id] && srcState[s.id].on)
    .map(s => `${icon(s.icon)} ${activeItems.filter(i => i.source === s.id).length}`).join(' · ');
  document.getElementById('top-stats').innerHTML =
    `<b>${total}</b> ${pluralize(total,'вариант','варианта','вариантов')}${bySrc ? ' &nbsp;•&nbsp; ' + bySrc : ''}`;
  const empty = document.getElementById('wheel-empty');
  empty.style.display = total === 0 ? 'flex' : 'none';
  if (total === 0) {
    const anySrc = SOURCES.some(s => srcState[s.id] && srcState[s.id].on);
    const anyWho = Object.keys(whoState).some(k => whoState[k]);
    empty.innerHTML = !anySrc ? 'Выбери источники слева —<br>варианты появятся на колесе'
      : !anyWho ? (collecting ? 'Ждём «я» в чате…' : 'Нажми «Собрать из чата»<br>или отметь заказчиков слева')
      : 'Под эти фильтры<br>ничего не подходит';
  }
  ['btn-single','btn-elim'].forEach(id => { document.getElementById(id).disabled = total === 0 || isSpinning || autoRunning; });
  document.getElementById('btn-auto').disabled = !autoRunning && (total === 0 || isSpinning);
}

// ============================================================
// Раскладка секторов
// ============================================================
function computeSegments() {
  const n = activeItems.length;
  if (n === 0) return [];
  const share = 360 / n;                       // все варианты равны

  const shares = activeItems.map((it, i) => ({ item: it, itemIndex: i, angle: share }));
  const splitOn = n > 1 && n < SPLIT_BELOW;
  shares.forEach(s => {
    s.parts = splitOn ? Math.max(1, Math.min(MAX_PARTS, Math.floor(s.angle / MIN_SLICE_ANGLE))) : 1;
  });

  const ordered = [];
  shares.forEach((s, i) => {
    const offset = (i * 0.37) % 1;
    for (let j = 0; j < s.parts; j++) {
      ordered.push({ item: s.item, itemIndex: s.itemIndex, angle: s.angle / s.parts, key: (j + offset) / s.parts });
    }
  });
  ordered.sort((a, b) => a.key - b.key);

  let cumulative = 0;
  return ordered.map(s => {
    const startAngle = cumulative;
    cumulative += s.angle;
    return {
      item: s.item, itemIndex: s.itemIndex, angle: s.angle,
      startAngle: startAngle, endAngle: cumulative,
      midAngle: startAngle + s.angle / 2,
    };
  });
}

function sectorPath(cx, cy, r, startAngle, endAngle) {
  const s = (startAngle - 90) * Math.PI / 180, e = (endAngle - 90) * Math.PI / 180;
  const x1 = cx + Math.cos(s) * r, y1 = cy + Math.sin(s) * r;
  const x2 = cx + Math.cos(e) * r, y2 = cy + Math.sin(e) * r;
  return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${(endAngle - startAngle) > 180 ? 1 : 0} 1 ${x2} ${y2} Z`;
}

// Геометрия колеса в координатах viewBox 0..100: сектора до WHEEL_R,
// дальше неподвижный обод с бликом. Штырьки на ободе крутятся с колесом.
const WHEEL_R = 44;
const RIM_R = 48.5;
const PEG_R = 46.25;
const MAX_PEGS = 72;   // больше — штырьки сливаются, ставим декоративные через равный шаг

// Сектор темнеет к центру и светлеет у обода — колесо выглядит объёмным
function sectorGradient(id, color) {
  return `<radialGradient id="${id}" cx="50" cy="50" r="${WHEEL_R}" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="${shade(color, -95)}"/>
    <stop offset="0.38" stop-color="${shade(color, -38)}"/>
    <stop offset="0.8" stop-color="${color}"/>
    <stop offset="0.95" stop-color="${shade(color, 28)}"/>
    <stop offset="1" stop-color="${shade(color, -20)}"/>
  </radialGradient>`;
}

function renderWheel() {
  const svg = document.getElementById('wheel');
  if (activeItems.length === 0) { currentSegments = []; labelCache = []; svg.innerHTML = ''; return; }

  const segments = computeSegments();
  currentSegments = segments;
  liveRotation = currentRotation;

  let content = '';
  const grads = {};
  const cx = 50, cy = 50, r = WHEEL_R;
  segments.forEach(seg => {
    const base = srcById(seg.item.source);
    const color = shade(base ? base.color : '#888', ((seg.itemIndex % 3) - 1) * 18);
    const gid = 'sg-' + color.slice(1);
    if (!grads[gid]) grads[gid] = sectorGradient(gid, color);
    content += `<path d="${sectorPath(cx, cy, r, seg.startAngle, seg.endAngle)}" fill="url(#${gid})" stroke="rgba(255,255,255,0.32)" stroke-width="0.18" data-item="${seg.itemIndex}"/>`;

    if (seg.angle >= 2) {
      const textRadius = r * 0.86;
      const rad = (seg.midAngle - 90) * Math.PI / 180;
      const tx = cx + Math.cos(rad) * textRadius, ty = cy + Math.sin(rad) * textRadius;
      const baseRot = seg.midAngle - 90;
      const fontSize = Math.min(2.7, Math.max(1.45, seg.angle * 0.4));
      // Полный текст пишем как есть — подрежет fitLabels() по факту замера
      content += `<text x="${tx}" y="${ty}" fill="#0a0e1a" font-size="${fontSize}"
        data-base="${baseRot.toFixed(3)}" data-tx="${tx.toFixed(3)}" data-ty="${ty.toFixed(3)}"
        data-angle="${seg.angle.toFixed(4)}" data-full="${esc(seg.item.title)}"
        text-anchor="end" dominant-baseline="middle"
        transform="rotate(${baseRot} ${tx} ${ty})"
        style="paint-order: stroke; stroke: rgba(255,255,255,0.6); stroke-width: 0.5;
               font-weight: 700; pointer-events: none;">${esc(seg.item.title)}</text>`;
    }
  });

  // Штырьки — на границах секторов (по ним щёлкает стрелка); если секторов
  // слишком много, просто ровный ряд
  const pegAngles = segments.length <= MAX_PEGS
    ? segments.map(s => s.startAngle)
    : Array.from({ length: 48 }, (_, i) => i * 7.5);
  let pegs = '';
  pegAngles.forEach(a => {
    const rad = (a - 90) * Math.PI / 180;
    pegs += `<circle cx="${(cx + Math.cos(rad) * PEG_R).toFixed(3)}" cy="${(cy + Math.sin(rad) * PEG_R).toFixed(3)}" r="0.95" fill="url(#peg)" stroke="rgba(0,0,0,0.45)" stroke-width="0.2"/>`;
  });

  svg.innerHTML = `
    <defs>
      ${Object.values(grads).join('')}
      <linearGradient id="rim" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" style="stop-color: var(--rim-1)"/>
        <stop offset="0.3" style="stop-color: var(--rim-2)"/>
        <stop offset="0.62" style="stop-color: var(--rim-3)"/>
        <stop offset="1" style="stop-color: var(--rim-4)"/>
      </linearGradient>
      <radialGradient id="peg" cx="0.35" cy="0.3" r="0.8">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.5" style="stop-color: var(--rim-2)"/>
        <stop offset="1" style="stop-color: var(--rim-3)"/>
      </radialGradient>
      <radialGradient id="edge-shade" cx="50" cy="50" r="${WHEEL_R}" gradientUnits="userSpaceOnUse">
        <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
      </radialGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="hub" cx="0.4" cy="0.35" r="0.75">
        <stop offset="0" stop-color="#1d2b4a"/>
        <stop offset="1" stop-color="#05080f"/>
      </radialGradient>
    </defs>
    <circle cx="50" cy="50" r="${RIM_R}" fill="url(#rim)"/>
    <circle cx="50" cy="50" r="${RIM_R - 0.35}" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="0.3"/>
    <circle cx="50" cy="50" r="${WHEEL_R + 0.35}" fill="#05080f"/>
    <g id="wheel-group" style="transform-origin: 50% 50%; transform: rotate(${currentRotation}deg); transition: none;">
      ${content}
      ${pegs}
    </g>
    <circle cx="50" cy="50" r="${WHEEL_R}" fill="url(#edge-shade)" pointer-events="none"/>
    <path d="M ${50 - WHEEL_R * 0.86} 44 A ${WHEEL_R} ${WHEEL_R} 0 0 1 ${50 + WHEEL_R * 0.86} 44 Q 50 34 ${50 - WHEEL_R * 0.86} 44 Z" fill="url(#gloss)" pointer-events="none"/>
    <circle cx="50" cy="50" r="8.6" fill="url(#rim)" stroke="rgba(0,0,0,0.5)" stroke-width="0.3"/>
    <circle cx="50" cy="50" r="6.7" fill="url(#hub)" stroke="rgba(255,255,255,0.25)" stroke-width="0.25"/>
    <use href="#i-dice" x="46.3" y="46.3" width="7.4" height="7.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gold, #FAC775)"/>`;

  labelCache = svg.querySelectorAll('#wheel-group text[data-base]');
  fitLabels();
  updateLabelOrientation(currentRotation);
}

// ============================================================
// Подгонка длины подписей
//
// Подписи идут по радиусу, а сектор к центру сужается: его ширина
// на радиусе r равна r * угол(рад). Слишком длинная строка доезжает
// туда, где ширины уже не хватает, и налезает на соседние сектора.
//
// Считать длину по числу символов нельзя — кириллица, латиница и
// цифры имеют разную ширину. Поэтому меряем реальную длину строки
// через getComputedTextLength() и подрезаем двоичным поиском.
// ============================================================
function fitLabels() {
  const textR = WHEEL_R * 0.86;     // радиус, на котором заканчивается подпись
  for (let i = 0; i < labelCache.length; i++) {
    const el = labelCache[i];
    const angle = parseFloat(el.dataset.angle);
    const fs = parseFloat(el.getAttribute('font-size'));
    const full = el.dataset.full || '';

    // Глубже этого радиуса буквы уже не помещаются между соседями
    const rMin = Math.max(10, (fs * 1.15) / (angle * 0.017453));
    const maxLen = Math.max(3, textR - rMin);

    el.textContent = full;
    const measured = el.getComputedTextLength();

    // В скрытой вкладке браузер не размечает SVG и возвращает 0 — мерить
    // нечего, оцениваем по числу символов (≈0.65 кегля на символ).
    if (!measured) {
      const maxChars = Math.max(3, Math.floor(maxLen / (fs * 0.65)));
      if (full.length > maxChars) el.textContent = full.slice(0, maxChars - 1).trimEnd() + '…';
      continue;
    }
    if (measured <= maxLen) continue;                     // влезло целиком

    let lo = 0, hi = full.length;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      el.textContent = full.slice(0, mid).trimEnd() + '…';
      if (el.getComputedTextLength() <= maxLen) lo = mid; else hi = mid - 1;
    }
    el.textContent = lo > 0 ? full.slice(0, lo).trimEnd() + '…' : '';
  }
}

// Подписи крутятся вместе с колесом — переворачиваем их на лету,
// чтобы к стрелке ни одна не подъехала вверх ногами
function updateLabelOrientation(rotDeg) {
  for (let i = 0; i < labelCache.length; i++) {
    const el = labelCache[i];
    const base = parseFloat(el.dataset.base);
    const onScreen = (((base + rotDeg) % 360) + 360) % 360;
    const flipped = (onScreen > 90 && onScreen < 270) ? '1' : '0';
    if (el.dataset.flipped === flipped) continue;
    el.dataset.flipped = flipped;
    el.setAttribute('transform', `rotate(${flipped === '1' ? base + 180 : base} ${el.dataset.tx} ${el.dataset.ty})`);
    el.setAttribute('text-anchor', flipped === '1' ? 'start' : 'end');
  }
}

// ============================================================
// Прокрутка
// ============================================================
const POINTER_ANGLE = 90;   // стрелка справа: ник победителя горизонтален

function pickWinnerIndex() {
  const n = activeItems.length;
  if (n === 0) return -1;
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return Math.floor((buf[0] / 0x100000000) * n);
}

function cubicBezier(y1, y2, t) { const inv = 1 - t, t2 = t * t; return 3*inv*inv*t*y1 + 3*inv*t2*y2 + t2*t; }
function cubicBezierX(x1, x2, t) { const inv = 1 - t, t2 = t * t; return 3*inv*inv*t*x1 + 3*inv*t2*x2 + t2*t; }
function easeOutBezier(t) {
  let low = 0, high = 1, mid = t;
  for (let i = 0; i < 20; i++) {
    const x = cubicBezierX(0.17, 0.2, mid);
    if (Math.abs(x - t) < 1e-6) break;
    if (x < t) low = mid; else high = mid;
    mid = (low + high) / 2;
  }
  return cubicBezier(0.67, 1, mid);
}
function normalizeAngle(a) { const n = a % 360; return n < 0 ? n + 360 : n; }
function boundaryCrossed(prev, next, boundary, decreasing) {
  if (decreasing) {
    if (prev >= next) return next < boundary && boundary <= prev;
    return boundary > next || boundary <= prev;
  }
  if (next >= prev) return prev < boundary && boundary <= next;
  return boundary > prev || boundary <= next;
}

async function trackPointerTicks(startRot, endRot, dur, segments) {
  const startTime = performance.now();
  const totalDelta = endRot - startRot;
  const boundaries = segments.map(s => normalizeAngle(s.startAngle));
  let last = normalizeAngle(POINTER_ANGLE - startRot);
  const decreasing = totalDelta > 0;
  return new Promise(resolve => {
    function frame(now) {
      const t = Math.min((now - startTime) / 1000 / dur, 1);
      const currentRot = startRot + totalDelta * easeOutBezier(t);
      liveRotation = currentRot;
      updateLabelOrientation(currentRot);
      const onWheel = normalizeAngle(POINTER_ANGLE - currentRot);
      for (const b of boundaries) if (boundaryCrossed(last, onWheel, b, decreasing)) triggerTick();
      last = onWheel;
      if (t < 1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

function triggerTick() {
  const p = document.getElementById('wheel-pointer');
  p.classList.remove('ticking');
  void p.offsetWidth;
  p.classList.add('ticking');
  playClick();
}

// В авто-режиме всё, кроме кнопки «Стоп», заблокировано и между крутками
function setControlsDisabled(d) {
  const lock = d || autoRunning;
  ['btn-single','btn-elim','btn-reset','btn-reload'].forEach(id => document.getElementById(id).disabled = lock);
  document.querySelectorAll('.duration-btn[data-dur]').forEach(b => b.disabled = lock);
  document.getElementById('btn-auto').disabled = autoRunning ? false : d;
}

async function spin(callback, dur = duration) {
  if (isSpinning || activeItems.length === 0) return;
  if (collecting) stopCollect('Сбор закрыт: крутим');
  if (activeItems.length === 1) { if (callback) callback(0); return; }

  isSpinning = true;
  setControlsDisabled(true);
  const gen = wheelGen;

  const segments = currentSegments.length ? currentSegments : computeSegments();
  const winnerIdx = pickWinnerIndex();

  // У победителя может быть несколько кусочков — останавливаемся на случайном
  const slices = segments.filter(s => s.itemIndex === winnerIdx);
  let chosen = slices[0];
  if (slices.length > 1) {
    const p = new Uint32Array(1); crypto.getRandomValues(p);
    chosen = slices[p[0] % slices.length];
  }
  if (!chosen) { isSpinning = false; setControlsDisabled(false); return; }

  const cur = ((currentRotation % 360) + 360) % 360;
  const tgt = (((POINTER_ANGLE - chosen.midAngle) % 360) + 360) % 360;
  let delta = tgt - cur; if (delta < 0) delta += 360;
  const startRotation = currentRotation;
  const finalRotation = currentRotation + 4 * 360 + delta;
  currentRotation = finalRotation;

  const group = document.querySelector('#wheel-group');
  group.style.transition = `transform ${dur}s cubic-bezier(0.17, 0.67, 0.2, 1)`;
  group.style.transform = `rotate(${finalRotation}deg)`;

  await trackPointerTicks(startRotation, finalRotation, dur, segments);
  liveRotation = finalRotation;
  updateLabelOrientation(finalRotation);
  await new Promise(r => setTimeout(r, 100));

  // Пока крутилось, колесо пересобрали фильтрами — индекс уже про другой список.
  // Результат применяем до разблокировки кнопок: вспышка вылетающего сектора
  // идёт ещё полсекунды, и новая крутка в это время сломала бы выбывание.
  if (gen === wheelGen) {
    wheelFx.burst();
    if (callback) await callback(winnerIdx);
  }
  isSpinning = false;
  setControlsDisabled(false);
  updateStats();
}

// Вылетающий вариант вспыхивает на всех своих кусочках
function flashItem(idx) {
  const group = document.getElementById('wheel-group');
  if (!group) return Promise.resolve();
  group.querySelectorAll(`path[data-item="${idx}"]`).forEach(p => {
    const f = p.cloneNode();
    f.removeAttribute('data-item');
    f.setAttribute('fill', '#fff');
    f.setAttribute('class', 'seg-flash');
    group.appendChild(f);
  });
  return new Promise(r => setTimeout(r, 650));
}

// ============================================================
// Блёстки в масле
//
// Колесо будто лежит в густом масле с блёстками. Раскрутили колесо —
// масло у обода тянется за ним, дальние слои отстают и разгоняются
// медленнее; после остановки блёстки ещё долго плывут по инерции.
// На большой скорости их отбрасывает наружу, потом они оседают обратно.
//
// Расстояния — в радиусах колеса (1 = край обода). Угол растёт по
// часовой, как и поворот колеса в CSS.
// ============================================================
const wheelFx = (() => {
  const cv = document.getElementById('wheel-fx');
  const ctx = cv.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CANVAS_SCALE = 1.6;          // холст больше колеса (см. .wheel-fx)
  const R_OUTER = RIM_R / 50;        // край обода в долях половины колеса
  const COUNT = reduceMotion ? 0 : 340;
  const winter = () => document.documentElement.classList.contains('season-winter');
  const PALETTE = winter()
    ? ['#ffffff', '#e3f4ff', '#bfe6ff', '#a9deff', '#8ec5ff', '#d9ccff']
    : ['#ffffff', '#fff1c9', '#ffd98a', '#fac775', '#ffc2e0', '#cfe8ff'];

  let W = 0, H = 0, R = 0, dpr = 1;
  const parts = [];
  let sparks = [];

  function resize() {
    const rect = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.width = Math.round(rect.width * dpr);
    H = cv.height = Math.round(rect.height * dpr);
    R = W / CANVAS_SCALE / 2 * R_OUTER;
  }

  function spawn() {
    const u = Math.random();
    const r0 = 1.04 + 0.5 * Math.pow(u, 1.5);          // гуще у обода
    return {
      r: r0, r0, th: Math.random() * Math.PI * 2,
      w: 0, vr: 0,
      size: 0.9 + Math.random() * Math.random() * 3,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      ph: Math.random() * Math.PI * 2,
      tw: 0.6 + Math.random() * 2.4,                    // скорость мерцания
      star: Math.random() < 0.3,                        // часть — четырёхлучевые искры
    };
  }
  for (let i = 0; i < COUNT; i++) parts.push(spawn());

  // Искры из-под стрелки, когда колесо встало
  function burst() {
    if (reduceMotion || !R) return;
    const x = W / 2 + R * 0.97, y = H / 2;
    for (let i = 0; i < 46; i++) {
      const a = (Math.random() - 0.5) * Math.PI * 1.3;
      const v = (0.4 + Math.random() * 1.4) * R;
      sparks.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, decay: 0.55 + Math.random() * 0.7,
        size: (0.8 + Math.random() * 1.8) * dpr,
        color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      });
    }
  }

  function drawStar(x, y, len, width) {
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x - len, y); ctx.lineTo(x + len, y);
    ctx.moveTo(x, y - len); ctx.lineTo(x, y + len);
    ctx.stroke();
  }

  let last = performance.now(), lastRot = liveRotation, t = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now; t += dt;
    if (!W || !COUNT || !dt) return;

    // Скорость колеса берём из его настоящего угла; вне крутки угол
    // может прыгнуть при пересборке — это не вращение
    let wheelW = 0;
    if (isSpinning) wheelW = (liveRotation - lastRot) * Math.PI / 180 / dt;
    lastRot = liveRotation;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const cx = W / 2, cy = H / 2;
    const rMax = (W / 2) / R;                            // край холста в радиусах колеса

    for (const p of parts) {
      const inv = 1 / p.r;
      // Масло тянется за ободом и быстро слабеет с расстоянием;
      // без вращения — еле заметное течение, чтобы блёстки жили
      const target = wheelW * inv * inv * inv + 0.05 * inv;
      const grip = 2.4 * inv * inv;                      // дальние слои откликаются медленнее
      p.w += (target - p.w) * (1 - Math.exp(-grip * dt));
      p.vr += 0.0026 * p.w * p.w * p.r * dt;             // центробежная сила
      p.vr += (p.r0 - p.r) * 1.8 * dt;                   // оседают обратно
      p.vr *= Math.exp(-2.6 * dt);                       // вязкость
      p.r += p.vr * dt;
      if (p.r < 1.02) { p.r = 1.02; p.vr = Math.abs(p.vr) * 0.3; }
      p.th += p.w * dt;

      const fade = p.r > rMax * 0.82 ? Math.max(0, (rMax - p.r) / (rMax * 0.18)) : 1;
      if (fade <= 0) continue;
      const glint = Math.pow(Math.max(0, Math.sin(t * p.tw + p.ph)), 8);
      const alpha = (0.45 + 0.55 * glint) * fade;
      const x = cx + Math.cos(p.th) * p.r * R;
      const y = cy + Math.sin(p.th) * p.r * R;
      const size = p.size * dpr;

      // На скорости блёстка вытягивается в штрих вдоль своего пути
      const trail = Math.min(0.4, Math.abs(p.w) * 0.035);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = ctx.fillStyle = p.color;
      if (trail * p.r * R > size * 1.5) {
        const back = p.th - Math.sign(p.w) * trail;
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.arc(cx, cy, p.r * R, Math.min(back, p.th), Math.max(back, p.th));
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, size * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }
      if (glint > 0.4) {                                 // мягкий ореол на вспышке
        ctx.globalAlpha = 0.16 * glint * fade;
        ctx.beginPath();
        ctx.arc(x, y, size * 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      if (p.star && glint > 0.35) {
        ctx.globalAlpha = glint * fade;
        drawStar(x, y, size * (3 + glint * 4), Math.max(0.7, size * 0.35));
      }
    }

    if (sparks.length) {
      sparks = sparks.filter(s => (s.life -= s.decay * dt) > 0);
      for (const s of sparks) {
        s.vx *= Math.exp(-2.2 * dt); s.vy *= Math.exp(-2.2 * dt);
        s.vy += 0.25 * R * dt;                           // чуть оседают вниз
        s.x += s.vx * dt; s.y += s.vy * dt;
        ctx.globalAlpha = Math.min(1, s.life * 1.4);
        ctx.strokeStyle = ctx.fillStyle = s.color;
        drawStar(s.x, s.y, s.size * (1.5 + s.life * 2.5), Math.max(0.6 * dpr, s.size * 0.4));
      }
    }
    ctx.globalAlpha = 1;
  }

  if (COUNT) {
    new ResizeObserver(resize).observe(cv);
    resize();
    requestAnimationFrame(frame);
  }
  return { burst };
})();

// ============================================================
// Звук
// ============================================================
// Щелчок стрелки — на выбор: «Дерево» и «Мягкий» синтезируются,
// «Шарик» — файлы sounds/click-2..5.wav (те же, что в Хаос-рулетке).
// Выбор запоминается в браузере. «Выкл» глушит и фанфары.
const SOUND_KEY = 'picker.clickSound';
const BALL_SOUNDS = [2, 3, 4, 5].map(n => `sounds/click-${n}.wav`);
let clickSound = 'wood';
try { const s = localStorage.getItem(SOUND_KEY); if (s) clickSound = s; } catch (e) {}
if (!document.querySelector(`.sound-group [data-sound="${clickSound}"]`)) clickSound = 'wood';
const soundOn = () => clickSound !== 'off';

let audioCtx = null, noiseBuf = null, ballBufs = null, lastClickAt = 0;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    // Полсекунды белого шума — из него «деревянная» атака щелчка
    noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate / 2, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}
function loadBallSounds() {
  if (ballBufs || !audioCtx) return;
  ballBufs = [];
  BALL_SOUNDS.forEach(src => fetch(src)
    .then(r => r.arrayBuffer())
    .then(b => audioCtx.decodeAudioData(b))
    .then(buf => ballBufs.push(buf))
    .catch(() => {}));
}

// Короткий глухой «ток»: щелчок шума через полосовой фильтр + затухающий тон корпуса
function clickWood(now, vol) {
  const pitch = 1 + (Math.random() - 0.5) * 0.08;
  const n = audioCtx.createBufferSource();
  n.buffer = noiseBuf;
  n.playbackRate.value = pitch;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2200 * pitch; bp.Q.value = 1.2;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.0001, now);
  ng.gain.exponentialRampToValueAtTime(0.35 * vol, now + 0.001);
  ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.018);
  n.connect(bp).connect(ng).connect(audioCtx.destination);
  n.start(now, Math.random() * 0.4); n.stop(now + 0.03);

  const o = audioCtx.createOscillator(), og = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(950 * pitch, now);
  o.frequency.exponentialRampToValueAtTime(520 * pitch, now + 0.03);
  og.gain.setValueAtTime(0.0001, now);
  og.gain.exponentialRampToValueAtTime(0.16 * vol, now + 0.002);
  og.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
  o.connect(og).connect(audioCtx.destination);
  o.start(now); o.stop(now + 0.06);
}

// Тихий округлый «пум» без высоких частот
function clickSoft(now, vol) {
  const pitch = 1 + (Math.random() - 0.5) * 0.06;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1400;
  o.type = 'triangle';
  o.frequency.setValueAtTime(560 * pitch, now);
  o.frequency.exponentialRampToValueAtTime(330 * pitch, now + 0.05);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.22 * vol, now + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
  o.connect(lp).connect(g).connect(audioCtx.destination);
  o.start(now); o.stop(now + 0.09);
}

function clickBall(now, vol) {
  if (!ballBufs || !ballBufs.length) { clickWood(now, vol); return; }
  const s = audioCtx.createBufferSource(), g = audioCtx.createGain();
  s.buffer = ballBufs[Math.floor(Math.random() * ballBufs.length)];
  g.gain.value = 0.6 * vol;
  s.connect(g).connect(audioCtx.destination);
  s.start(now);
}

function playClick() {
  if (!soundOn()) return; ensureAudio(); if (!audioCtx) return;
  const now = audioCtx.currentTime;
  // На разгоне сектора мелькают десятками в секунду: реже 25 мс не щёлкаем,
  // а частые щелчки делаем тише — вместо трещотки получается мягкий шелест
  const dt = now - lastClickAt;
  if (dt < 0.025) return;
  lastClickAt = now;
  const vol = Math.min(1, 0.35 + dt * 5);
  if (clickSound === 'soft') clickSoft(now, vol);
  else if (clickSound === 'ball') clickBall(now, vol);
  else clickWood(now, vol);
}
function playFanfare() {
  if (!soundOn()) return; ensureAudio(); if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [[261.63,0,0.18],[329.63,0.18,0.18],[392,0.36,0.18],[523.25,0.54,0.4],
   [659.25,1.0,0.2],[783.99,1.2,0.2],[1046.5,1.45,0.8]].forEach(([f,t,d]) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f, t0 + t);
    gain.gain.setValueAtTime(0, t0 + t);
    gain.gain.linearRampToValueAtTime(0.12, t0 + t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + t + d);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0 + t); osc.stop(t0 + t + d + 0.05);
  });
}
function updateSoundButtons() {
  document.querySelectorAll('.sound-group [data-sound]').forEach(b =>
    b.classList.toggle('active', b.dataset.sound === clickSound));
}
document.querySelectorAll('.sound-group [data-sound]').forEach(btn => {
  btn.addEventListener('click', () => {
    clickSound = btn.dataset.sound;
    try { localStorage.setItem(SOUND_KEY, clickSound); } catch (e) {}
    updateSoundButtons();
    if (!soundOn()) return;
    ensureAudio(); loadBallSounds();
    // Сразу даём послушать: три щелчка с замедлением
    lastClickAt = 0;
    [0, 140, 320].forEach(ms => setTimeout(() => { lastClickAt = 0; playClick(); }, ms));
  });
});
updateSoundButtons();
document.addEventListener('click', () => { if (soundOn()) { ensureAudio(); loadBallSounds(); } }, { once: true });

function showWinner(item) {
  const s = srcById(item.source);
  const cat = document.getElementById('winner-cat');
  cat.innerHTML = s ? `${icon(s.icon)} ${esc(s.name)}` : '';
  cat.style.color = s ? s.color : '#fff';

  document.getElementById('winner-title').textContent = item.title;
  document.getElementById('winner-who-text').textContent = item.who ? `заказ: ${item.who}` : '';

  const ava = document.getElementById('winner-who-ava');
  const url = avatarOf(item.who);
  if (url) { ava.style.backgroundImage = `url('${url}')`; ava.classList.add('show'); }
  else { ava.classList.remove('show'); ava.style.backgroundImage = ''; }

  // Обложка: показываем только если картинка реально загрузилась
  const cover = document.getElementById('winner-cover');
  cover.classList.remove('show');
  cover.removeAttribute('src');
  if (item.cover && /^https?:\/\//i.test(item.cover)) {
    cover.onload  = () => cover.classList.add('show');
    cover.onerror = () => cover.classList.remove('show');
    cover.src = item.cover;
  }

  const link = document.getElementById('winner-link');
  if (item.link && /^https?:\/\//i.test(item.link)) {
    link.href = item.link; link.classList.add('show');
  } else {
    link.classList.remove('show'); link.removeAttribute('href');
  }

  document.getElementById('winner-overlay').classList.add('show');
  launchConfetti();
  playFanfare();
}
function hideWinner() {
  document.getElementById('winner-overlay').classList.remove('show');
  const c = document.getElementById('confetti');
  c.classList.remove('active'); c.innerHTML = '';
}
document.getElementById('winner-close-btn').addEventListener('click', hideWinner);

function launchConfetti() {
  const c = document.getElementById('confetti');
  c.classList.add('active'); c.innerHTML = '';
  const colors = ['#FAC775','#E58CC0','#6FB7E8','#9B8CE8','#FFE194','#ffffff'];
  for (let i = 0; i < 120; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 8 + Math.random() * 10;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = size + 'px'; p.style.height = size + 'px';
    const col = colors[Math.floor(Math.random() * colors.length)];
    p.style.backgroundColor = col;
    p.style.boxShadow = `0 0 ${size}px ${col}`;
    p.style.setProperty('--drift', ((Math.random() - 0.5) * 400) + 'px');
    p.style.animationDuration = (3 + Math.random() * 2.5) + 's';
    p.style.animationDelay = (Math.random() * 0.6) + 's';
    const shape = Math.floor(Math.random() * 3);
    if (shape === 1) p.style.borderRadius = '50%';
    else if (shape === 2) p.style.clipPath = 'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';
    c.appendChild(p);
  }
  setTimeout(() => { if (c.classList.contains('active')) c.innerHTML = ''; }, 6000);
}

}

function setEliminationUi(on) {

  document.getElementById('btn-elim').innerHTML = icon('swords') + (on ? ' Крутить (выбывание)' : ' Режим выбывания');

// Выкидываем выпавший вариант; когда остаётся один — он победитель
async function eliminateAt(idx) {
  if (activeItems.length === 1) { finishElimination(); return; }
  const gen = wheelGen;
  await flashItem(idx);
  if (gen !== wheelGen) return;
  addLogEntry(activeItems[idx], false, activeItems.length);
  activeItems.splice(idx, 1);
  updateStats();
  renderWheel();
  if (activeItems.length === 1) {
    const gen = wheelGen;
    setTimeout(() => { if (gen === wheelGen) finishElimination(); }, 700);
  }
}

document.getElementById('btn-single').addEventListener('click', () => {
  if (eliminationMode) {
    if (!confirm('Активен режим выбывания. Прервать и выбрать одного?')) return;
    setEliminationUi(false);
  }
  spin(idx => { const w = activeItems[idx]; addLogEntry(w, true); showWinner(w); });
});

document.getElementById('btn-elim').addEventListener('click', () => {
  if (!eliminationMode) setEliminationUi(true);
  spin(eliminateAt);
});

// ------------------------------------------------------------
// Авто-выбывание: колесо само крутит и выкидывает по одному.
// Чем меньше осталось, тем дольше крутка и пауза — финал тянется.
// Скорость выбирается по числу вариантов перед круткой.
// ------------------------------------------------------------
const AUTO_PHASES = [
  { upTo: 2,        spin: 60, pause: 3 },   // финальная крутка
  { upTo: 5,        spin: 10, pause: 3 },
  { upTo: 10,       spin: 5,  pause: 2 },
  { upTo: Infinity, spin: 3,  pause: 2 },
];
const autoPhase = n => AUTO_PHASES.find(p => n <= p.upTo);

let autoWake = null;          // прерывает паузу между крутками при «Стоп»
let manualDuration = duration;

function pause(sec) {
  return new Promise(resolve => {
    const done = () => { clearTimeout(timer); autoWake = null; resolve(); };
    const timer = setTimeout(done, sec * 1000);
    autoWake = done;
  });
}

function stopAuto() {
  if (!autoRunning) return;
  autoRunning = false;
  if (autoWake) autoWake();
}

async function runAuto() {
  autoRunning = true;
  manualDuration = duration;
  const btn = document.getElementById('btn-auto');
  btn.classList.add('running');
  btn.innerHTML = icon('stop') + ' Стоп авто';
  setEliminationUi(true);
  setControlsDisabled(false);
  updateStats();

  const gen = wheelGen;
  let first = true;
  while (autoRunning && gen === wheelGen && activeItems.length > 1) {
    const n = activeItems.length;
    const ph = autoPhase(n);
    if (!first) {
      await pause(ph.pause);
      if (!autoRunning || gen !== wheelGen) break;
    }
    first = false;
    highlightDuration(ph.spin);
    await spin(eliminateAt, ph.spin);
  }

  autoRunning = false;
  autoWake = null;
  btn.classList.remove('running');
  btn.innerHTML = icon('bot') + ' Авто-выбывание';
  duration = manualDuration;
  highlightDuration(duration);
  setControlsDisabled(isSpinning);
  updateStats();
}

document.getElementById('btn-auto').addEventListener('click', () => {
  if (autoRunning) {
    // Идущая крутка доедет и выкинет свой вариант, дальше — ручной режим
    stopAuto();
    if (isSpinning) document.getElementById('btn-auto').innerHTML = icon('stop') + ' Остановится после крутки';
    return;
  }
  if (activeItems.length === 0 || isSpinning) return;
  if (activeItems.length === 1) { finishElimination(); return; }
  runAuto();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Сбросить? Все выбывшие вернутся, история очистится.')) return;
  hideWinner();
  rebuildWheel();
});

document.getElementById('btn-reload').addEventListener('click', async () => {
  const b = document.getElementById('btn-reload');
  b.disabled = true; b.innerHTML = icon('hourglass') + ' Загрузка…';
  await loadAll();
  b.disabled = false; b.innerHTML = icon('refresh') + ' Перезагрузить';
});

loadAll();
</script>
