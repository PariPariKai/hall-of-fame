<!--
  Оверлей активных модификаторов для OBS: browser source 1920×1080, прозрачный фон.
    mods.html            — карточки в правом верхнем углу
    mods.html?pos=tl     — угол: tl / tr / bl / br, или tc — сверху по центру
    mods.html?scale=2    — крупнее/мельче (по умолчанию 1.7)
    mods.html?demo       — предпросмотр с ненастоящими модификаторами

  Откуда берутся карточки: cards.html (менеджер или ?stream) после крутки кладёт выпавший
  модификатор в список и рассылает его:
    • localStorage + BroadcastChannel — если рулетка открыта в том же браузере (в OBS);
    • мост localhost:3777 (/api/mods) — если рулетка открыта в обычном браузере.
  Побеждает более свежий список (updatedAt). Снять / продлить — кнопка с таймером в cards.html.
-->
