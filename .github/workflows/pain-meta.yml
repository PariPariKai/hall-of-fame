# Подтягивает обложки, жанры и годы для новых игр из пула «Боль» и коммитит pain-meta.json.
# Запуск: каждые 30 минут и вручную (Actions → «Боль: данные игр» → Run workflow).
name: "Боль: данные игр"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pain-meta
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK Claude (нужен только для описаний «от себя»)
        if: ${{ env.HAS_ANTHROPIC == 'true' }}
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk
      - run: node .github/scripts/pain-meta.mjs
        env:
          # Необязательно: ключ Claude API — робот придумывает короткое описание для новых игр.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Необязательно: ключи приложения Twitch для запасного поиска в IGDB.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Коммит, если что-то изменилось
        run: |
          if git diff --quiet -- pain-meta.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add pain-meta.json
          git commit -m "Боль: обновлены данные игр"
          git pull --rebase
          git push
