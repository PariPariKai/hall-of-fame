<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Wheel</title>
<meta name="robots" content="noindex,nofollow">

<!-- ============================================================
     ⚙ НАСТРОЙКА ⚙
     TICKETS_CSV_URL — лист Tickets
     VIEWERS_CSV_URL — лист Viewers (база зрителей с аватарками)
     Вход — код стримера или токен GitHub (github.js → siteGit.gate).
     ============================================================ -->
<script>
  const TICKETS_CSV_URL = "data/tickets.json";
  const VIEWERS_CSV_URL = "data/viewers.json";
</script>

<link rel="stylesheet" href="core/theme.css?v=1">
<link rel="stylesheet" href="core/nav.css?v=1">
<link rel="stylesheet" href="core/gate.css?v=1">
<link rel="stylesheet" href="modules/wheel/wheel.page.css?v=3">
</head>

<body>

  <!-- ===== ОБЩЕЕ МЕНЮ: выпадающие разделы (одинаково на всех страницах) ===== -->
  <script src="core/core.js?v=1"></script><script src="core/site.js?v=19"></script>
<script src="core/github.js?v=7"></script>

  <!-- Экран входа -->
  <div class="gate" id="gate">
    <div class="gate-title">Введите код</div>
    <form id="gate-form" onsubmit="return false;">
      <input type="password" class="gate-input" id="gate-input" autocomplete="off" autofocus>
      <div class="gate-error" id="gate-error"></div>
<div class="gate-hint">или вставь токен GitHub из админки — запомнится</div>
      <br>
      <button type="submit" class="gate-button" id="gate-submit">Войти</button>
    </form>
  </div>

  <!-- Основной интерфейс -->
  <div class="app" id="app">
    <div class="app-header">
      <div class="app-title"><svg class="ic" aria-hidden="true"><use href="#i-wheel"></use></svg> Рулетка билетов</div>
      <div class="app-stats" id="app-stats">Загрузка...</div>
    </div>

    <div id="elimination-status" class="elimination-status">
      Режим выбывания. Осталось участников: <span id="elim-remaining">0</span>
    </div>

    <div class="wheel-area">
      <svg class="wheel-svg" id="wheel" viewBox="0 0 100 100"></svg>
      <div class="wheel-pointer" id="wheel-pointer">
        <svg viewBox="0 0 52 60">
          <polygon points="26,58 4,8 48,8" fill="#FAC775" stroke="#0a0e1a" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="26" cy="10" r="5" fill="#FAC775" stroke="#0a0e1a" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <div class="controls">
      <div class="duration-group">
        <span class="duration-label"><svg class="ic" aria-hidden="true"><use href="#i-timer"></use></svg> Длительность</span>
        <button class="duration-btn" data-dur="3">3с</button>
        <button class="duration-btn active" data-dur="5">5с</button>
        <button class="duration-btn" data-dur="10">10с</button>
      </div>
      <button class="sound-toggle" id="sound-toggle"><svg class="ic" aria-hidden="true"><use href="#i-volume"></use></svg> Звук вкл.</button>
    </div>

    <div class="controls">
      <button class="ctrl-btn primary" id="btn-single"><svg class="ic" aria-hidden="true"><use href="#i-target"></use></svg> Один победитель</button>
      <button class="ctrl-btn primary" id="btn-elim"><svg class="ic" aria-hidden="true"><use href="#i-swords"></use></svg> Режим выбывания</button>
      <button class="ctrl-btn danger" id="btn-reset">↺ Сброс</button>
      <button class="ctrl-btn" id="btn-reload"><svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg> Перезагрузить билеты</button>
    </div>

    <div class="log" id="log">
      <div class="log-title">История розыгрыша</div>
      <div id="log-entries"></div>
    </div>
  </div>

  <!-- Конфетти -->
  <div class="confetti-container" id="confetti"></div>

  <!-- Победитель -->
  <div class="winner-overlay" id="winner-overlay">
    <div class="winner-card">
      <div class="winner-label">✦ Победитель ✦</div>
      <div class="winner-avatar" id="winner-avatar"></div>
      <div class="winner-nick" id="winner-nick"></div>
      <div class="winner-tickets" id="winner-tickets"></div>
      <button class="ctrl-btn winner-close" id="winner-close-btn">Закрыть</button>
    </div>
  </div>

<script src="modules/wheel/wheel.page.js?v=1"></script>
</body>
</html>
