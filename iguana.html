<title>Игуана — оверлей</title>
<meta name="robots" content="noindex,nofollow">
<!--
  Игуана проходит по низу экрана слева направо. OBS: browser source 1920×1080, прозрачный фон.
    iguana.html              — проходит при загрузке и каждый раз, когда источник снова становится видимым
                               (включил глазик / переключил сцену — игуана пошла)
    iguana.html?every=10     — ещё и сама каждые 10 минут
    iguana.html?first=7&every=10
                             — по расписанию: первый раз через 7 минут после запуска сцены, потом каждые 10.
                               Сразу при показе не выходит; смена сцены туда-обратно начинает отсчёт заново,
                               пока сцена не в эфире — расписание стоит
    iguana.html?loop         — ходит без остановки, одна за другой
    iguana.html?size=640     — ширина игуаны в пикселях кадра 1920 (по умолчанию 640)
    iguana.html?bottom=20    — поднять над нижним краем на 20 px
    iguana.html?speed=1.5    — быстрее/медленнее (1 — лапы не проскальзывают)
    iguana.html?delay=2      — пауза перед каждым выходом, секунд
    iguana.html?dir=rtl      — справа налево (зеркально)
  Параметры складываются: iguana.html?every=15&size=480&bottom=40
-->
<link rel="stylesheet" href="modules/iguana/iguana.page.css?v=1">
</head>

</body>
</html>
