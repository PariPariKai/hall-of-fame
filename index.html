  const MOVIES_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThU3PDQlG4EPkPHygpf1q54KuNuuc4WYWnGqZde3-8iD8buBBFLEkr3MIDdnvv-oekgEN0CXj7Bq6C/pub?gid=627100002&single=true&output=csv";
  const SERIES_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThU3PDQlG4EPkPHygpf1q54KuNuuc4WYWnGqZde3-8iD8buBBFLEkr3MIDdnvv-oekgEN0CXj7Bq6C/pub?gid=627100003&single=true&output=csv";

<link rel="stylesheet" href="site.css?v=4">
<style>
  /* Меню и иконки — общие (site.css / site.js). Остальное — своё у главной. */

  body {
    background: #0a0e1a;
    background-image:
      radial-gradient(ellipse at top center, rgba(250, 199, 117, 0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(127, 119, 221, 0.08), transparent 55%);
    background-attachment: fixed;
    min-height: calc(100vh / var(--zoom, 1));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    padding: 0 20px 60px;
  }

  .site-nav { margin-bottom: 0; }

  /* ========== РОЗЫГРЫШ (баннер, только когда raffle_active) ========== */
  .event {
    max-width: var(--page);
    margin: 22px auto 0;
  }
  .event[hidden] { display: none; }
  .event__inner {
    display: flex;
    align-items: center;
    gap: 14px 22px;
    flex-wrap: wrap;
    padding: 14px 22px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    background:
      linear-gradient(100deg, rgba(250,199,117,0.18), rgba(250,199,117,0.04) 45%, rgba(127,119,221,0.10));
    border: 1px solid rgba(250,199,117,0.45);
    box-shadow: 0 0 30px rgba(250,199,117,0.12);
    position: relative;
    overflow: hidden;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .event__inner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.10) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: event-shine 5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes event-shine { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .event__inner:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(250,199,117,0.25); }
  .event__badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #0a0e1a;
    background: #FAC775;
    padding: 5px 10px;
    border-radius: 999px;
    font-weight: 700;
    white-space: nowrap;
  }
  .event__title { font-size: 16px; font-weight: 600; color: #FAC775; letter-spacing: .5px; }
  .event__timer {
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .event__stats { font-size: 13px; color: rgba(255,255,255,0.65); }
  .event__stats b { color: #fff; }
  .event__cta {
    margin-left: auto;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FAC775;
    white-space: nowrap;
  }

  /* ========== HERO ========== */
  .hero {
    max-width: var(--page);
    margin: 0 auto;
    padding: 56px 0 44px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 460px);
    gap: 48px;
    align-items: center;
  }
  .hero__top {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 20px;
  }
  .hero__avatar-wrap {
    width: 116px;
    height: 116px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #1a2238;
    border: 3px solid rgba(250,199,117,0.55);
    box-shadow: 0 0 0 6px rgba(250,199,117,0.07), 0 0 40px rgba(250,199,117,0.18), 0 8px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FAC775;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .hero__avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero__name {
    font-size: 52px;
    font-weight: 600;
    letter-spacing: 4px;
    line-height: 1.05;
    color: #FAC775;
    text-shadow: 0 0 28px rgba(250, 199, 117, 0.45);
    text-transform: uppercase;
    word-break: break-word;
  }
  .hero__intro {
    font-size: 16px;
    line-height: 1.65;
    color: rgba(255,255,255,0.75);
    max-width: 560px;
    margin: 0 0 28px;
  }
  .hero__cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(250,199,117,0.15), rgba(250,199,117,0.05));
    border: 1px solid rgba(250,199,117,0.5);
    color: #FAC775;
    padding: 12px 26px;
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 500;
    box-shadow: 0 0 18px rgba(250,199,117,0.18);
    transition: all 0.2s ease;
  }
  .hero__cta:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(250,199,117,0.22), rgba(250,199,117,0.08));
    box-shadow: 0 0 30px rgba(250,199,117,0.35);
    color: #fff;
  }
  .hero__cta--hidden { display: none; }

  /* ----- «Сейчас на стриме» ----- */
  .now {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .now__label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin: 2px 4px 14px;
  }
  .now__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff4d5e;
    box-shadow: 0 0 0 0 rgba(255,77,94,0.6);
    animation: now-pulse 1.8s ease-out infinite;
  }
  .now__dot[hidden] { display: none; }
  @keyframes now-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,77,94,0.6); }
    100% { box-shadow: 0 0 0 10px rgba(255,77,94,0); }
  }
  .now__list { display: flex; flex-direction: column; gap: 12px; }
  .now-item {
    display: flex;
    gap: 16px;
    padding: 10px;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    position: relative;
    overflow: hidden;
    background: rgba(10,14,26,0.55);
    border: 1px solid rgba(255,255,255,0.06);
    transition: border-color .18s ease, transform .18s ease;
  }
  .now-item:hover { border-color: rgba(250,199,117,0.45); transform: translateY(-2px); }
  .now-item__glow {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(28px) saturate(1.3);
    opacity: .28;
    pointer-events: none;
  }
  .now-item__cover {
    position: relative;
    flex: 0 0 auto;
    width: 92px;
    height: 138px;
    border-radius: 8px;
    overflow: hidden;
    background: #1a2238;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  .now-item__cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Обложка любой формы в вертикальной рамке: горизонтальную (Steam header и т.п.)
     не режем, а вписываем целиком поверх её же размытой копии */
  .pcover__blur {
    position: absolute;
    inset: -12px;
    background-size: cover;
    background-position: center;
    filter: blur(12px) brightness(.55);
    display: none;
  }
  .pcover.is-landscape .pcover__blur { display: block; }
  .pcover img { position: relative; }
  .pcover.is-landscape img { object-fit: contain; }
  .now-item__body {
    position: relative;
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .now-item__type {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FAC775;
  }
  .now-item__title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .now-item__by { font-size: 13px; color: rgba(255,255,255,0.6); }
  .now-item__by b { color: #fff; font-weight: 600; }
  .now-item__bar {
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
    margin-top: 4px;
  }
  .now-item__bar span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #BA7517, #FAC775);
    box-shadow: 0 0 10px rgba(250,199,117,0.5);
  }
  .now-item__meta { font-size: 12px; color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums; }
  .now__skeleton {
    height: 158px;
    border-radius: 12px;
    background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    background-size: 200% 100%;
    animation: skel 1.4s linear infinite;
  }
  @keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ----- Афиша: главный анонс крупнее ----- */
  .now-item--big .now-item__cover { width: 116px; height: 174px; }
  .now-item--big .now-item__title { font-size: 21px; }
  .now-item__when {
    font-size: 17px;
    font-weight: 600;
    color: #FAC775;
    letter-spacing: .3px;
    font-variant-numeric: tabular-nums;
  }
  .now-item__rel {
    display: inline-block;
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(250,199,117,0.12);
    color: #FAC775;
  }
  .now-item__rel--live { background: rgba(255,77,94,0.18); color: #ff8a95; }
  .now__sub {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin: 6px 4px -4px;
  }

  /* ----- Традиция: когда ничего не назначено ----- */
  .ritual {
    padding: 16px;
    border-radius: 12px;
    background: rgba(10,14,26,0.55);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ritual__row { display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.4; }
  .ritual__time {
    flex: 0 0 auto;
    font-size: 18px;
    font-weight: 600;
    color: #FAC775;
    font-variant-numeric: tabular-nums;
  }
  .ritual__next { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }
  .ritual__next b { color: #fff; font-weight: 600; }
  .ritual a { font-size: 12px; letter-spacing: 1px; color: #FAC775; text-decoration: none; }
  .ritual a:hover { text-decoration: underline; }

  /* ----- Расписание недели ----- */
  .week { margin-top: 32px; max-width: 520px; }
  .week__label {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 10px;
  }
  .week__days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .week__day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 9px 2px;
    border-radius: 10px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .week__name { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .week__time { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .week__day.is-off .week__time { color: rgba(255,255,255,0.35); font-weight: 400; font-size: 12px; }
  .week__day.is-today {
    border-color: rgba(250,199,117,0.55);
    background: rgba(250,199,117,0.08);
    box-shadow: 0 0 16px rgba(250,199,117,0.12);
  }
  .week__day.is-today .week__name { color: #FAC775; }
  .week__note { margin-top: 10px; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.5); }
  .week__note b { color: #FAC775; font-weight: 600; }
  @media (max-width: 480px) {
    .now-item--big .now-item__cover { width: 90px; height: 135px; }
    .now-item--big .now-item__title { font-size: 18px; }
    .week__days { gap: 4px; }
    .week__time { font-size: 12px; }
  }

  /* ========== ЛЕНТА ПОБЕД ========== */
  .wins {
    max-width: var(--page);
    margin: 0 auto 36px;
  }
  .wins[hidden] { display: none; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 4px 12px;
  }
  .section-head h2 {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .section-head a {
    font-size: 12px;
    letter-spacing: 1px;
    color: #FAC775;
    text-decoration: none;
    opacity: .85;
  }
  .section-head a:hover { opacity: 1; text-decoration: underline; }
  .wins__track {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .wins__row {
    display: flex;
    gap: 12px;
    width: max-content;
    padding: 4px 0 8px;
  }
  .wins__row.is-moving { animation: wins-scroll var(--wins-dur, 60s) linear infinite; }
  .wins__track:hover .wins__row { animation-play-state: paused; }
  @keyframes wins-scroll { from { transform: translateX(0); } to { transform: translateX(calc(-50% - 6px)); } }
  .win {
    --rc: #AFA9EC;
    --rc-bg: rgba(127,119,221,0.10);
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 260px;
    padding: 12px 14px;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    background: var(--rc-bg);
    border: 1px solid color-mix(in srgb, var(--rc) 35%, transparent);
    transition: border-color .18s ease, transform .18s ease;
  }
  .win:hover { border-color: var(--rc); transform: translateY(-2px); }
  .win--legendary { --rc: #F0997B; --rc-bg: rgba(216,90,48,0.10); }
  .win--artifact  { --rc: #FAC775; --rc-bg: rgba(250,199,117,0.09); }
  .win__top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .win__rank { color: var(--rc); font-size: 14px; }
  .win__nick { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win__date { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; }
  .win__prize {
    font-size: 14px;
    color: var(--rc);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .win__quote {
    font-size: 12px;
    font-style: italic;
    color: rgba(255,255,255,0.55);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ========== СЕТКА КАРТОЧЕК ========== */
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: var(--page);
    margin: 0 auto;
  }
  /* Сколько маленьких карточек видно (data-n) зависит от розыгрыша и сериалов —
     Зал Славы растягивается так, чтобы сетка закрывалась без дыр */
  .cards[data-n="3"] .page-card--hall { grid-column: 1 / -1; }
  .cards[data-n="4"] .page-card--hall { grid-column: span 2; }
  .page-card[hidden] { display: none; }
  .page-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    position: relative;
    overflow: hidden;
  }
  .page-card:hover {
    transform: translateY(-3px);
    border-color: rgba(250,199,117,0.45);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 14px 32px rgba(0,0,0,0.4), 0 0 24px rgba(250,199,117,0.1);
  }
  .page-card__art {
    position: relative;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: radial-gradient(circle at 50% 120%, rgba(250,199,117,0.12), transparent 65%);
  }
  .page-card__bg {
    position: absolute;
    inset: -30px;
    background-size: cover;
    background-position: center;
    filter: blur(26px) saturate(.9) brightness(.4);
    opacity: .45;
    transition: opacity .25s ease;
  }
  .page-card:hover .page-card__bg { opacity: .65; }
  .page-card__icon {
    position: relative;
    font-size: 54px;
    line-height: 1;
    color: #FAC775;
    filter: drop-shadow(0 0 16px rgba(250,140,80,0.45));
  }
  .page-card__icon .ic { display: block; stroke-width: 1.5; }
  .now-item__cover > .ic { font-size: 36px; color: #FAC775; stroke-width: 1.6; }
  .fan { position: relative; width: 100%; height: 100%; }
  .fan__item {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 84px;
    height: 126px;
    margin: -63px 0 0 -42px;

<script>
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { cell += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { cell += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c === '\r') {}
      else { cell += c; }
    }
  }
  if (cell.length > 0 || row.length > 0) {
    row.push(cell);
    if (row.some(c => c.length > 0)) rows.push(row);
  }
  return rows;
}

// Строки CSV -> объекты по заголовкам (заголовки в нижнем регистре), пустые строки отбрасываются
function rowsToObjects(rows) {
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1)
    .filter(r => r.some(c => (c || '').trim().length > 0))
    .map(r => {
      const o = {};
      headers.forEach((h, i) => { o[h] = (r[i] || '').trim(); });
      return o;
    });
}

function rowsToConfig(rows) {
  const config = {};
  rowsToObjects(rows).forEach(r => {
    if (r.key) config[r.key.toLowerCase()] = r.value || '';
  });
  return config;
}

async function fetchRows(url) {
  if (!url) throw new Error('нет ссылки');
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}

function isValidUrl(s) {
  if (!s) return false;
  try {
    const u = new URL(s);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch (e) {
    return false;
  }
}

// Обложка для витрины: гифки (часто мемы-заглушки) не берём
function isNiceCover(s) {
  return isValidUrl(s) && !/\.gif(\?|$)|tenor\.com|giphy\.com/i.test(s);
}

function isTruthy(v) {
  return ['true', 'yes', '1', 'да'].includes(String(v || '').trim().toLowerCase());
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// plural(5, ['победа','победы','побед']) -> 'побед'
function plural(n, forms) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b === 1) return forms[0];
  if (b >= 2 && b <= 4) return forms[1];
  return forms[2];
}

// Google Sheets (EU locale) отдаёт даты как DD.MM.YYYY — Date() прочитал бы их как MM.DD
function parseSheetDate(str) {
  if (!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}
function dateTs(str) {
  const d = parseSheetDate(str);
  return d && !isNaN(d.getTime()) ? d.getTime() : 0;
}

function setCounter(key, html) {
  const el = document.querySelector(`[data-counter="${key}"]`);
  if (el) el.innerHTML = html;
}

// ===== Конфиг: имя, интро, аватар, Twitch, розыгрыш =====
function applyConfig(config) {
  const name = (config.streamer_name || '').trim();
  const intro = (config.streamer_intro || '').trim();
  const avatar = (config.streamer_avatar_url || '').trim();
  const twitch = (config.streamer_twitch_url || '').trim();

  if (name) {
    document.getElementById('hero-name').textContent = name;
    document.title = name;
    const initials = name.replace(/[^A-Za-zА-Яа-я0-9]/g, '').slice(0, 2).toUpperCase() || 'PK';
    document.getElementById('hero-avatar-fallback').textContent = initials;
  }
  if (intro) {
    document.getElementById('hero-intro').textContent = intro;
  }

  if (isValidUrl(avatar)) {
    const img = document.getElementById('hero-avatar');
    const fb = document.getElementById('hero-avatar-fallback');
    img.onload = () => { img.style.display = 'block'; fb.style.display = 'none'; };
    img.onerror = () => { img.style.display = 'none'; fb.style.display = ''; };
    // Twitch отдаёт аватар в нескольких размерах — 70x70 на большом круге мылит, берём 300x300
    img.src = /jtvnw\.net/.test(avatar)
      ? avatar.replace(/-profile_image-\d+x\d+\./, '-profile_image-300x300.')
      : avatar;
    img.alt = name || 'Avatar';
  }

  if (isValidUrl(twitch)) {
    const cta = document.getElementById('hero-cta');
    cta.href = twitch;
    cta.classList.remove('hero__cta--hidden');
  }

  setupRaffle(config);
}

// ===== Розыгрыш: включается/выключается ключом raffle_active в листе Config =====
let raffleTimer = null;

function setupRaffle(config) {
  const active = isTruthy(config.raffle_active);
  const ticketsNav = document.querySelector('.site-nav__links a[href="tickets.html"]');
  if (ticketsNav) ticketsNav.parentElement.hidden = !active;
  if (!active) return;

  document.getElementById('event').hidden = false;
  document.getElementById('card-tickets').hidden = false;
  layoutCards();
  if (config.raffle_title) document.getElementById('event-title').textContent = config.raffle_title;

  const date = parseSheetDate(config.raffle_date);
  const timerEl = document.getElementById('event-timer');
  if (date && !isNaN(date.getTime())) {
    const tick = () => {
      const diff = date - Date.now();
      if (diff <= 0) {
        timerEl.innerHTML = icon('zap', 'ic--fill') + ' Розыгрыш уже идёт!';
        clearInterval(raffleTimer);
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor(diff / 3600000) % 24;
      const m = Math.floor(diff / 60000) % 60;
      const s = Math.floor(diff / 1000) % 60;
      const pad = n => String(n).padStart(2, '0');
      timerEl.textContent = (d > 0 ? `${d} д ` : '') + `${pad(h)}:${pad(m)}:${pad(s)}`;
    };
    tick();
    raffleTimer = setInterval(tick, 1000);
  }

  fetchRows(TICKETS_CSV_URL)
    .then(rows => {
      let participants = 0, total = 0;
      rowsToObjects(rows).forEach(r => {
        const n = (parseInt(r.silver, 10) || 0) + (parseInt(r.gold, 10) || 0);
        if (n > 0) { participants++; total += n; }
      });
      const stats = participants === 0
        ? 'пока нет участников — будь первым'
        : `<b>${participants}</b> ${plural(participants, ['участник', 'участника', 'участников'])} · <b>${total}</b> ${plural(total, ['билет', 'билета', 'билетов'])}`;
      document.getElementById('event-stats').innerHTML = stats;
      setCounter('tickets', stats.replace(/<b>/g, '<span class="accent">').replace(/<\/b>/g, '</span>'));
    })
    .catch(err => {
      console.warn('Tickets load failed:', err.message);
      setCounter('tickets', '—');
    });
}

// Ссылка и обложка, найденные роботом (.github/scripts/orders-meta.mjs), — только если в таблице пусто.
// У YouTube-заказов без обложки берём превью прямо из ссылки на видео.
const ORDERS_META = fetch('orders-meta.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
function metaKey(list, title) {
  return list + '|' + String(title || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('ru').replace(/ё/g, 'е');
}
function applyOrdersMeta(items, meta, list) {
  const found = (meta && meta.items) || {};
  items.forEach(it => {
    const m = found[metaKey(list, it.title)];
    if (m && m.found) {
      if (!it.url && m.url) it.url = m.url;
      if (!it.cover_url && m.cover) it.cover_url = m.cover;
      // Обложка в таблице есть — запоминаем робота как запасную вертикальную (см. fitCover)
      else if (m.cover && m.cover !== it.cover_url) it.alt_cover = m.cover;
    }
    const yt = (it.url || '').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/);
    if (!it.cover_url && yt) it.cover_url = `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`;
  });
}

// ===== Списки заказов =====
const CATS = {
  anime:  { url: ANIME_CSV_URL,  page: 'anime.html',  label: 'Аниме',  icon: 'torii', active: ['watching'], done: ['watched'] },
  movies: { url: MOVIES_CSV_URL, page: 'movies.html', label: 'Фильм',  icon: 'film', active: ['watching'], done: ['watched'] },
  series: { url: SERIES_CSV_URL, page: 'series.html', label: 'Сериал', icon: 'tv', active: ['watching'], done: ['watched'] },
  games:  { url: GAMES_CSV_URL,  page: 'games.html',  label: 'Игра',   icon: 'gamepad', active: ['playing'],  done: ['completed'] },
};

function statusOf(item) { return (item.status || 'pending').toLowerCase(); }

// Обложки бывают и вертикальные, и горизонтальные: горизонтальную вписываем целиком (см. .pcover)
function blurLayer(url) {
  return `<div class="pcover__blur" style="background-image:url('${esc(url)}')"></div>`;
}
function fitCover(img) {
  if (img.naturalWidth <= img.naturalHeight * 0.85) return;
  // Горизонтальная картинка из таблицы, а у робота есть вертикальная обложка — показываем её
  const alt = img.dataset.alt;
  if (alt) {
    img.dataset.alt = '';
    const blur = img.parentNode.querySelector('.pcover__blur');
    if (blur) blur.style.backgroundImage = `url("${alt.replace(/"/g, '%22')}")`;
    img.src = alt;
    return;
  }
  img.parentNode.classList.add('is-landscape');
}

function layoutCards() {
  const cards = document.getElementById('cards');
  cards.dataset.n = cards.querySelectorAll('.page-card:not(.page-card--hall):not([hidden])').length;
}

// Назначен на сегодня или позже (и не досмотрен, не на паузе)
function isScheduled(it) {
  if (!it.scheduled_at || ['watched', 'paused'].includes(statusOf(it))) return false;
  const d = parseSheetDate(it.scheduled_at);
  return !!d && !isNaN(d.getTime()) && d >= startOfDay(new Date());
}

function countText(key, items) {
  if (items.length === 0) return 'пока пусто';
  const cat = CATS[key];
  const queued = items.filter(i => statusOf(i) === 'pending').length;
  const active = items.filter(i => cat.active.includes(statusOf(i))).length;
  const done = items.filter(i => cat.done.includes(statusOf(i))).length;
  const parts = [`<span class="accent">${queued}</span> в очереди`];
  if (active > 0) parts.push(`<span class="accent">${active}</span> ${key === 'games' ? 'играем' : 'смотрим'}`);
  parts.push(`<span class="accent">${done}</span> ${key === 'games' ? 'пройдено' : 'просмотрено'}`);
  // Игры без концовки (R.E.P.O, No Man's Sky…) — статус played, «сыграно»
  const played = key === 'games' ? items.filter(i => statusOf(i) === 'played').length : 0;
  if (played > 0) parts.push(`<span class="accent">${played}</span> сыграно`);
  return parts.join(' · ');
}

// Веер из трёх свежих обложек очереди; если обложек нет — остаётся эмодзи
function renderFan(key, items) {
  const art = document.getElementById('art-' + key);
  if (!art) return;
  const covers = items
    .filter(i => statusOf(i) === 'pending' && isNiceCover(i.cover_url))
    .map((i, idx) => ({ i, idx }))
    .sort((a, b) => (dateTs(b.i.date_added) - dateTs(a.i.date_added)) || (b.idx - a.idx))
    .map(x => ({url: x.i.cover_url, alt: x.i.alt_cover || ''}));
  if (covers.length === 0) return;
  // Порядок в DOM: левая, правая, центральная (центральная — самая свежая, рисуется сверху)
  const shown = covers.slice(0, 3);
  const order = shown.length === 3 ? [shown[1], shown[2], shown[0]] : shown.slice().reverse();
  const fanItems = order.map(c =>
    `<div class="fan__item pcover">${blurLayer(c.url)}<img src="${esc(c.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-alt="${esc(c.alt)}" onload="fitCover(this)" onerror="fanImgError(this)"></div>`
  ).join('');
  art.innerHTML = `
    <div class="page-card__bg" style="background-image:url('${esc(covers[0].alt || covers[0].url)}')"></div>
    <div class="fan">${fanItems}</div>`;
  const fan = art.querySelector('.fan');
  fan._spare = covers.slice(3, 8).map(c => c.url);   // запас на случай битых ссылок
  layoutFan(fan);
}

function layoutFan(fan) {
  const items = [...fan.children];
  const pos = items.length === 3 ? ['l', 'r', 'c'] : items.length === 2 ? ['l2', 'r2'] : ['c'];
  items.forEach((el, i) => {
    el.className = el.className.replace(/\s*fan__item--\w+/g, '') + ' fan__item--' + pos[i];
  });
}

// Битая обложка: подставляем следующую из запаса, а если запаса нет — убираем и перекладываем веер
function fanImgError(img) {
  const item = img.parentNode;
  const fan = item.parentNode;
  const spare = fan._spare && fan._spare.shift();
  if (spare) {
    item.classList.remove('is-landscape');
    item.querySelector('.pcover__blur').style.backgroundImage = `url("${spare.replace(/"/g, '%22')}")`;
    img.src = spare;
    return;
  }
  item.remove();
  layoutFan(fan);
}

function progressOf(key, it) {
  if (key === 'games') {
    const pct = parseFloat((it.progress_percent || '').replace(',', '.'));
    const hours = parseFloat((it.hours_played || '').replace(',', '.'));
    const bits = [];
    if (pct > 0) bits.push(`${Math.round(pct)}%`);
    if (hours > 0) bits.push(`${hours % 1 ? hours.toFixed(1) : hours} ч в игре`);
    return { pct: pct > 0 ? Math.min(100, pct) : null, text: bits.join(' · ') };
  }
  const total = parseInt(it.episodes_total, 10);
  const watched = parseInt(it.episodes_watched, 10);
  if (total > 0 && watched >= 0) {
    const ofForm = (total % 10 === 1 && total % 100 !== 11) ? 'серии' : 'серий';
    return { pct: Math.min(100, watched / total * 100), text: `${watched} из ${total} ${ofForm}` };
  }
  if (total > 0) return { pct: null, text: `${total} ${plural(total, ['серия', 'серии', 'серий'])}` };
  return { pct: null, text: '' };
}

// ===== Расписание недели =====
// Лист Config: schedule_sun … schedule_sat = "17:00-22:00" (пусто = выходной), picker_time, movie_time.
// Пока ключей в Config нет — действует расписание ниже.
const DAY_KEYS  = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];   // индекс = Date.getDay()
const DAY_SHORT = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const DAY_IN    = ['в воскресенье', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

let SCHEDULE = {
  days: { sun: '17:00-22:00', mon: '17:00-22:00', tue: '17:00-22:00', wed: '17:00-22:00', thu: '17:00-22:00', fri: '14:00-18:00', sat: '' },
  picker: '19:00',
  movie: '20:00',
};

function applyScheduleConfig(config) {
  DAY_KEYS.forEach(k => {
    if (('schedule_' + k) in config) SCHEDULE.days[k] = config['schedule_' + k];
  });
  if (parseHM(config.picker_time)) SCHEDULE.picker = config.picker_time;
  if (parseHM(config.movie_time)) SCHEDULE.movie = config.movie_time;
}

function parseHM(s) {
  const m = String(s || '').match(/(\d{1,2})[:.](\d{2})/);
  return m ? { h: +m[1], m: +m[2] } : null;
}
function parseRange(s) {
  const m = String(s || '').match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/);
  return m ? { start: { h: +m[1], m: +m[2] }, end: { h: +m[3], m: +m[4] } } : null;
}
function atTime(day, hm) {
  const d = new Date(day);
  d.setHours(hm.h, hm.m, 0, 0);
  return d;
}
function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
const pad2 = n => String(n).padStart(2, '0');
const fmtHM = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

// Окно стрима в этот день: { start, end } или null (выходной)
function streamWindow(day) {
  const r = parseRange(SCHEDULE.days[DAY_KEYS[day.getDay()]]);
  if (!r) return null;
  return { start: atTime(day, r.start), end: atTime(day, r.end) };
}

// Ближайший стрим (начиная с from), в окно которого попадает время hm
function nextStreamAt(from, hm, includeFrom) {
  for (let i = 0; i < 14; i++) {
    const day = addDays(startOfDay(from), i);
    const w = streamWindow(day);
    if (!w) continue;
    const t = atTime(day, hm);
    if (t >= w.start && t < w.end && (includeFrom ? t > from : t >= addDays(startOfDay(from), 1))) return t;
  }
  return null;
}

function dayPhrase(d, now) {
  const diff = Math.round((startOfDay(d) - startOfDay(now)) / 86400000);
  if (diff === 0) return 'сегодня';
  if (diff === 1) return 'завтра';
  return DAY_IN[d.getDay()];
}

function renderWeek() {
  const now = new Date();
  const order = [1, 2, 3, 4, 5, 6, 0];
  const short = hm => hm.m ? `${hm.h}:${pad2(hm.m)}` : String(hm.h);
  const days = order.map(i => {
    const r = parseRange(SCHEDULE.days[DAY_KEYS[i]]);
    const cls = ['week__day'];
    if (!r) cls.push('is-off');
    if (i === now.getDay()) cls.push('is-today');
    const time = r ? `${short(r.start)}–${short(r.end)}` : 'отдых';
    return `<div class="${cls.join(' ')}"${i === now.getDay() ? ' aria-current="date"' : ''}>
      <span class="week__name">${DAY_SHORT[i]}</span><span class="week__time">${time}</span></div>`;
  }).join('');
  document.getElementById('week').innerHTML = `
    <div class="week__label">Расписание стримов</div>
    <div class="week__days">${days}</div>
    <p class="week__note">По вечерам: <b>${esc(SCHEDULE.picker)}</b> рулетка заказов · <b>${esc(SCHEDULE.movie)}</b> кино-вечер. Иногда начинаю раньше.</p>`;
}

// ===== Афиша: анонсы из колонки scheduled_at + то, что смотрим/играем сейчас =====
const SHOW_CATS = ['anime', 'movies', 'series'];
const FORMAT_LABEL = { sub: 'с субтитрами', dub: 'в озвучке' };
let afishaLists = null;

// Когда показ «закончился»: конец стрима в тот день, иначе +4 часа
function showEnd(start) {
  const w = streamWindow(start);
  if (w && w.end > start) return w.end;
  return new Date(start.getTime() + 4 * 3600000);
}

function relText(start, now) {
  const mins = Math.round((start - now) / 60000);
  const days = Math.round((startOfDay(start) - startOfDay(now)) / 86400000);
  if (days >= 2) return `через ${days} ${plural(days, ['день', 'дня', 'дней'])}`;
  if (days === 1) return 'завтра';
  if (mins >= 60) {
    const h = Math.floor(mins / 60), m = mins % 60;
    return `через ${h} ч${m ? ` ${m} мин` : ''}`;
  }
  return `через ${Math.max(1, mins)} мин`;
}

// Обложка не загрузилась — вместо неё иконка раздела
function coverFailed(img, cat) {
  img.parentNode.innerHTML = icon(CATS[cat].icon);
}

function renderNowItem(it, opts) {
  opts = opts || {};
  const cat = CATS[it._cat];
  const cover = isValidUrl(it.cover_url) ? it.cover_url : '';
  const prog = opts.noProgress ? { pct: null, text: '' } : progressOf(it._cat, it);
  let type = it._cat === 'movies' && (it.type || '').toLowerCase() === 'youtube' ? 'YouTube' : cat.label;
  const fmt = FORMAT_LABEL[(it.format || '').toLowerCase()];
  if (fmt) type += ' · ' + fmt;
  const meta = opts.meta != null ? opts.meta : prog.text;
  return `
    <a class="now-item${opts.big ? ' now-item--big' : ''}" href="${cat.page}">
      ${cover ? `<div class="now-item__glow" style="background-image:url('${esc(cover)}')"></div>` : ''}
      <div class="now-item__cover pcover">${cover
        ? `${blurLayer(cover)}<img src="${esc(cover)}" alt="" referrerpolicy="no-referrer" data-alt="${esc(it.alt_cover || '')}" onload="fitCover(this)" onerror="coverFailed(this, '${it._cat}')">`
        : icon(cat.icon)}</div>
      <div class="now-item__body">
        <span class="now-item__type">${esc(type)}</span>
        <h3 class="now-item__title">${esc(it.title || 'Без названия')}</h3>
        ${opts.when ? `<div class="now-item__when">${esc(opts.when)}</div>` : ''}
        ${opts.rel ? `<span class="now-item__rel${opts.live ? ' now-item__rel--live' : ''}">${esc(opts.rel)}</span>` : ''}
        ${it.nick ? `<p class="now-item__by">заказ от <b>${esc(it.nick)}</b></p>` : ''}
        ${prog.pct != null ? `<div class="now-item__bar"><span style="width:${prog.pct.toFixed(1)}%"></span></div>` : ''}
        ${meta ? `<p class="now-item__meta">${esc(meta)}</p>` : ''}
      </div>
    </a>`;
}

function renderRitual(now) {
  const picker = nextStreamAt(now, parseHM(SCHEDULE.picker), true);
  const movie = picker ? nextStreamAt(picker, parseHM(SCHEDULE.movie), false) : null;
  let next = '';
  if (picker) {
    next = `Ближайшая рулетка — <b>${dayPhrase(picker, now)} в ${fmtHM(picker)}</b>.`;
    if (movie) next += ` Что выпадет, смотрим <b>${dayPhrase(movie, now)} в ${fmtHM(movie)}</b>.`;
  }
  return `
    <div class="ritual">
      <div class="ritual__row"><span class="ritual__time">${esc(SCHEDULE.picker)}</span><span>Рулетка заказов: зрители решают, что смотрим дальше</span></div>
      <div class="ritual__row"><span class="ritual__time">${esc(SCHEDULE.movie)}</span><span>Кино-вечер: смотрим победителя прошлой рулетки</span></div>
      ${next ? `<p class="ritual__next">${next}</p>` : ''}
      <a href="picker.html">Рулетка заказов →</a>
    </div>`;
}

function renderNow() {
  const lists = afishaLists;
  if (!lists) return;
  const now = new Date();
  const all = [];
  Object.keys(lists).forEach(key => (lists[key] || []).forEach(it => all.push({ ...it, _cat: key })));

  // Анонсы: есть дата, не досмотрено и не на паузе, показ ещё не закончился
  const shows = all
    .filter(it => SHOW_CATS.includes(it._cat) && it.scheduled_at && !['watched', 'paused'].includes(statusOf(it)))
    .map(it => {
      let start = parseSheetDate(it.scheduled_at);
      if (!start || isNaN(start.getTime())) return null;
      // Только дата без времени — значит в обычное время кино-вечера
      if (start.getHours() === 0 && start.getMinutes() === 0) start = atTime(start, parseHM(SCHEDULE.movie));
      return { ...it, _start: start, _end: showEnd(start) };
    })
    .filter(it => it && it._end > now)
    .sort((a, b) => a._start - b._start);

  const shownKeys = new Set(shows.map(s => s._cat + '|' + s.title + '|' + s.nick));
  const continuing = all.filter(it =>
    CATS[it._cat].active.includes(statusOf(it)) && !shownKeys.has(it._cat + '|' + it.title + '|' + it.nick));

  const live = shows.length > 0 && shows[0]._start <= now;
  document.getElementById('now-dot').hidden = !live;
  document.getElementById('now-label').textContent = live ? 'Смотрим прямо сейчас' : 'Афиша';

  const parts = [];
  if (shows.length > 0) {
    const s = shows[0];
    parts.push(renderNowItem(s, {
      big: true,
      noProgress: s._cat === 'movies',
      when: `${DAY_SHORT[s._start.getDay()]}, ${s._start.getDate()} ${MONTHS_GEN[s._start.getMonth()]} · ${fmtHM(s._start)}`,
      rel: live ? 'идёт сейчас' : relText(s._start, now),
      live,
    }));
    shows.slice(1, 3).forEach(n => parts.push(renderNowItem(n, {
      noProgress: true,
      meta: `${dayPhrase(n._start, now)}, ${n._start.getDate()} ${MONTHS_GEN[n._start.getMonth()]} в ${fmtHM(n._start)}`,
    })));
  } else {
    parts.push(renderRitual(now));
  }
  const room = shows.length > 0 ? Math.max(0, 3 - Math.min(shows.length, 3)) : 2;
  if (continuing.length > 0 && room > 0) {
    parts.push(`<div class="now__sub">Продолжаем</div>`);
    continuing.slice(0, room).forEach(it => parts.push(renderNowItem(it)));
  }
  document.getElementById('now-list').innerHTML = parts.join('');
}

// ===== Зал Славы: лента последних побед + карточка =====
const RANKS = {
  epic:      { label: 'Эпическая',  symbol: '◆', forms: ['эпическая', 'эпических', 'эпических'] },
  legendary: { label: 'Легендарка', symbol: icon('star', 'ic--fill'), forms: ['легендарка', 'легендарки', 'легендарок'] },
  artifact:  { label: 'Артефакт',   symbol: icon('sparkles', 'ic--fill'), forms: ['артефакт', 'артефакта', 'артефактов'] },
};

function cleanQuote(q) {
  const s = String(q || '').trim().replace(/^["«„“']+|["»“”']+$/g, '').trim();
  return /^[?!.\s-]*$/.test(s) ? '' : s;
}

function renderWins(rows) {
  const wins = rowsToObjects(rows)
    .filter(w => w.nick && w.prize)
    .map((w, idx) => ({ ...w, rank: (w.rank || '').toLowerCase(), _idx: idx, _ts: dateTs(w.date) }));

  // Карточка Зала Славы
  const n = wins.length;
  setCounter('hall', `<span class="accent">${n}</span> ${plural(n, ['победа', 'победы', 'побед'])}`);
  const recent = wins.slice().sort((a, b) => (b._ts - a._ts) || (b._idx - a._idx));
  if (n > 0) {
    const pills = ['artifact', 'legendary', 'epic']
      .map(r => {
        const c = wins.filter(w => w.rank === r).length;
        return c ? `<span class="rank-pill rank-pill--${r}">${RANKS[r].symbol} ${c} ${plural(c, RANKS[r].forms)}</span>` : '';
      }).join('');
    const last = recent[0];
    document.getElementById('art-hall').innerHTML = `
      <div class="hall-art">
        <div class="hall-art__num">${n}</div>
        <div class="hall-art__ranks">${pills}</div>
        <div class="hall-art__last">последний: <b>${esc(last.nick)}</b> — ${esc(last.prize)}</div>
      </div>`;
  }

  // Лента
  const section = document.getElementById('wins');
  const row = document.getElementById('wins-row');
  const top = recent.slice(0, 16);
  if (top.length === 0) { section.hidden = true; return; }
  const chips = top.map(w => {
    const r = RANKS[w.rank] || RANKS.epic;
    const quote = cleanQuote(w.quote);
    const d = parseSheetDate(w.date);
    const dd = d && !isNaN(d.getTime()) ? `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}` : '';
    return `
      <a class="win win--${esc(w.rank)}" href="hall.html" title="${esc(r.label)}: ${esc(w.prize)}">
        <span class="win__top"><span class="win__rank">${r.symbol}</span><span class="win__nick">${esc(w.nick)}</span><span class="win__date">${dd}</span></span>
        <span class="win__prize">${esc(w.prize)}</span>
        ${quote ? `<span class="win__quote">«${esc(quote)}»</span>` : ''}
      </a>`;
  }).join('');

  // Бесконечная прокрутка: дублируем ленту, но только если она шире экрана
  row.innerHTML = chips;
  requestAnimationFrame(() => {
    if (row.scrollWidth <= row.parentElement.clientWidth) return;
    row.insertAdjacentHTML('beforeend', chips.replace(/<a /g, '<a tabindex="-1" aria-hidden="true" '));
    row.style.setProperty('--wins-dur', `${top.length * 5}s`);
    row.classList.add('is-moving');
  });
}

async function loadAll() {
  renderWeek();

  const configReady = fetchRows(CONFIG_CSV_URL)
    .then(rows => {
      const config = rowsToConfig(rows);
      applyConfig(config);
      applyScheduleConfig(config);
      renderWeek();
    })
    .catch(err => console.warn('Config load failed:', err.message));

  fetchRows(WINNERS_CSV_URL)
    .then(renderWins)
    .catch(err => {
      console.warn('Winners load failed:', err.message);
      setCounter('hall', '—');
      document.getElementById('wins').hidden = true;
    });

  // Списки грузятся параллельно; каждый переживает свою ошибку
  const keys = Object.keys(CATS);
  const results = await Promise.all(keys.map(key =>
    fetchRows(CATS[key].url)
      .then(async rows => {
        // Как на страницах списков: строка без ника или названия — не заказ (заготовки в таблице)
        const items = rowsToObjects(rows).filter(i => i.nick && i.title);
        applyOrdersMeta(items, await ORDERS_META, key);
        setCounter(key, countText(key, items));
        renderFan(key, items);
        return items;
      })
      .catch(err => {
        console.warn(`List "${key}" failed:`, err.message);
        setCounter(key, '—');
        return [];
      })
  ));
  afishaLists = {};
  keys.forEach((k, i) => { afishaLists[k] = results[i]; });
  document.getElementById('card-series').hidden = !afishaLists.series.some(it =>
    isScheduled(it) || CATS.series.active.includes(statusOf(it)));
  layoutCards();
  await configReady;   // афише нужно расписание (конец стрима, время рулетки)
  renderNow();
  // Раз в минуту: «через 2 ч» → «через 1 ч», анонс сам переключается на «идёт сейчас»
  setInterval(() => { renderNow(); renderWeek(); }, 60000);
}

// ===== Рекомендую: карусель друзей-стримеров =====
// Лист Friends: nick, image_url (картинка 5:1, лучше 2500×500), url (страница стрима;
// пусто — twitch.tv/ник), active (FALSE — спрятать). Порядок — как в таблице, старт — со случайного.
const FRIEND_COLORS = ['#8d4564', '#555897', '#ad704b', '#487c87', '#754d92', '#9a5359', '#687748', '#455f95'];
let friendsTimer = null;
async function loadFriends() {
  if (!FRIENDS_CSV_URL) return;
  let rows;
  try {
    const res = await fetch(FRIENDS_CSV_URL + '&cache=' + Date.now());
    if (!res.ok) return;
    rows = parseCSV(await res.text());
  } catch (e) { return; }
  if (rows.length < 2) return;
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = n => h.indexOf(n);
  const [cNick, cImg, cUrl, cActive] = [col('nick'), col('image_url'), col('url'), col('active')];
  if (cNick < 0) return;
  const friends = rows.slice(1).map(r => ({
    nick: (r[cNick] || '').trim(),
    image: cImg >= 0 ? (r[cImg] || '').trim() : '',
    url: cUrl >= 0 ? (r[cUrl] || '').trim() : '',
    active: cActive < 0 || !/^(false|нет|0|no)$/i.test((r[cActive] || '').trim()),
  })).filter(f => f.nick && f.active);
  renderFriends(friends);
}

function renderFriends(friends) {
  const box = document.getElementById('friends');
  const stage = document.getElementById('friends-stage');
  stage.querySelectorAll('.friend').forEach(el => el.remove());
  clearInterval(friendsTimer);
  box.hidden = !friends.length;
  if (!friends.length) return;
  stage.dataset.count = friends.length;
  const slides = friends.map((f, i) => {
    const url = isValidUrl(f.url) ? f.url : 'https://www.twitch.tv/' + encodeURIComponent(f.nick.replace(/\s+/g, ''));
    const a = document.createElement('a');
    a.className = 'friend';
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', `${f.nick} — открыть стрим`);
    const fallback = `<div class="friend__fallback" style="background:linear-gradient(120deg, ${FRIEND_COLORS[i % FRIEND_COLORS.length]}, #10142a)">${esc(f.nick)}</div>`;
    a.innerHTML = (isValidUrl(f.image) ? `<img class="friend__img" src="${esc(f.image)}" alt="" referrerpolicy="no-referrer" loading="lazy">` : fallback) +
      `<span class="friend__tag"><span class="friend__live"></span>${esc(f.nick)}<span class="friend__go">смотреть ${icon('external')}</span></span>`;
    const img = a.querySelector('img');
    if (img) img.addEventListener('error', () => img.outerHTML = fallback);
    stage.insertBefore(a, document.getElementById('friends-dots'));
    return a;
  });
  const dots = document.getElementById('friends-dots');
  dots.innerHTML = friends.map((f, i) => `<button type="button" class="friends__dot" data-i="${i}" aria-label="${esc(f.nick)}"></button>`).join('');
  let cur = Math.floor(Math.random() * friends.length); // стартуем со случайного — каждому другу шанс быть первым
  const show = i => {
    cur = (i + slides.length) % slides.length;
    slides.forEach((s, k) => { s.classList.toggle('is-on', k === cur); s.tabIndex = k === cur ? 0 : -1; });
    dots.querySelectorAll('.friends__dot').forEach((d, k) => d.classList.toggle('is-on', k === cur));
  };
  const restart = () => {
    clearInterval(friendsTimer);
    if (slides.length > 1) friendsTimer = setInterval(() => { if (!stage.matches(':hover')) show(cur + 1); }, 6000);
  };
  document.getElementById('friends-prev').onclick = () => { show(cur - 1); restart(); };
  document.getElementById('friends-next').onclick = () => { show(cur + 1); restart(); };
  dots.onclick = e => { const d = e.target.closest('.friends__dot'); if (d) { show(+d.dataset.i); restart(); } };
  // Свайп на телефоне
  let x0 = null;
  stage.ontouchstart = e => { x0 = e.touches[0].clientX; };
  stage.ontouchend = e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 40) { show(cur + (dx < 0 ? 1 : -1)); restart(); }
  };
  show(cur);
  restart();
}

loadAll();
loadFriends();
