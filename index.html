<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>ParipariKai</title>

<!-- ============================================================
     ⚙ НАСТРОЙКА ⚙  Все данные — data/*.json в репозитории, правятся на admin.html.
     Названия ниже остались от листов Google-таблицы.
     CONFIG_CSV_URL  — лист Config (имя стримера, интро, аватар, Twitch URL)
     TICKETS_CSV_URL — лист Tickets (для счётчика билетов)
     ANIME_CSV_URL   — лист Anime
     MOVIES_CSV_URL  — лист Movies
     SERIES_CSV_URL  — лист Series
     GAMES_CSV_URL   — лист Games (новый в v8)
     ============================================================ -->
<script>
  const CONFIG_CSV_URL  = "data/config.json";
  const TICKETS_CSV_URL = "data/tickets.json";
  const ANIME_CSV_URL   = "data/anime.json";
  const MOVIES_CSV_URL  = "data/movies.json";
  const SERIES_CSV_URL  = "data/series.json";
  // Лист Friends (друзья-стримеры для баннера «Рекомендую»): nick, image_url, url, active.
  // Пока пусто — баннер не показывается.
  const FRIENDS_CSV_URL = "data/friends.json";
  const GAMES_CSV_URL   = "data/games.json";
</script>

<link rel="stylesheet" href="core/site.css?v=8">
<link rel="stylesheet" href="modules/home/index.page.css?v=1">
</head>

<body>

<script src="core/core.js?v=1"></script><script src="core/site.js?v=19"></script>

<!-- Розыгрыш: виден, только когда в листе Config raffle_active = TRUE -->
<section class="event" id="event" hidden aria-label="Розыгрыш">
  <a class="event__inner" href="tickets.html">
    <span class="event__badge"><svg class="ic" aria-hidden="true"><use href="#i-ticket"></use></svg>Розыгрыш</span>
    <span class="event__title" id="event-title">Идёт сбор билетов</span>
    <span class="event__timer" id="event-timer"></span>
    <span class="event__stats" id="event-stats"></span>
    <span class="event__cta">Билеты →</span>
  </a>
</section>

<main class="hero" id="hero">
  <div class="hero__id">
    <div class="hero__top">
      <div class="hero__avatar-wrap">
        <img id="hero-avatar" class="hero__avatar" alt="" style="display:none;">
        <span id="hero-avatar-fallback">PK</span>
      </div>
      <h1 class="hero__name" id="hero-name">Stream</h1>
    </div>
    <p class="hero__intro" id="hero-intro">Добро пожаловать</p>
    <a class="hero__cta hero__cta--hidden" id="hero-cta" href="#" target="_blank" rel="noopener"><svg class="ic ic--fill" aria-hidden="true"><use href="#i-play"></use></svg>Смотреть на Twitch</a>
    <div class="week" id="week"></div>
  </div>

  <aside class="now" aria-labelledby="now-label">
    <div class="now__label"><span class="now__dot" id="now-dot" hidden></span><span id="now-label">Афиша</span></div>
    <div class="now__list" id="now-list"><div class="now__skeleton"></div></div>
  </aside>
</main>

<section class="cards" id="cards" data-n="3" aria-label="Разделы сайта">
  <a class="page-card page-card--tickets" id="card-tickets" href="tickets.html" hidden>
    <div class="page-card__art"><span class="page-card__icon"><svg class="ic" aria-hidden="true"><use href="#i-ticket"></use></svg></span></div>
    <div class="page-card__body">
      <h2 class="page-card__title">Билеты</h2>
      <p class="page-card__count" data-counter="tickets">…</p>
    </div>
  </a>
  <a class="page-card" href="anime.html">
    <div class="page-card__art" id="art-anime"><span class="page-card__icon"><svg class="ic" aria-hidden="true"><use href="#i-torii"></use></svg></span></div>
    <div class="page-card__body">
      <h2 class="page-card__title">Аниме</h2>
      <p class="page-card__count" data-counter="anime">…</p>
    </div>
  </a>
  <a class="page-card" href="movies.html">
    <div class="page-card__art" id="art-movies"><span class="page-card__icon"><svg class="ic" aria-hidden="true"><use href="#i-film"></use></svg></span></div>
    <div class="page-card__body">
      <h2 class="page-card__title">Фильмы</h2>
      <p class="page-card__count" data-counter="movies">…</p>
    </div>
  </a>
  <!-- Сериалы смотрим редко: карточка появляется, только когда сериал назначен или идёт -->
  <a class="page-card" id="card-series" href="series.html" hidden>
    <div class="page-card__art" id="art-series"><span class="page-card__icon"><svg class="ic" aria-hidden="true"><use href="#i-tv"></use></svg></span></div>
    <div class="page-card__body">
      <h2 class="page-card__title">Сериалы</h2>
      <p class="page-card__count" data-counter="series">…</p>
    </div>
  </a>
  <a class="page-card" href="games.html">
    <div class="page-card__art" id="art-games"><span class="page-card__icon"><svg class="ic" aria-hidden="true"><use href="#i-gamepad"></use></svg></span></div>
    <div class="page-card__body">
      <h2 class="page-card__title">Игры</h2>
      <p class="page-card__count" data-counter="games">…</p>
    </div>
  </a>
</section>

<!-- Рекомендую: друзья-стримеры из листа Friends. Нет листа или строк — блока не видно -->
<section class="friends" id="friends" hidden aria-labelledby="friends-label">
  <div class="section-head">
    <h2 id="friends-label">Рекомендую</h2>
  </div>
  <div class="friends__stage" id="friends-stage" aria-roledescription="карусель">
    <button type="button" class="friends__nav friends__nav--prev" id="friends-prev" aria-label="Предыдущий стример"><svg class="ic" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
    <button type="button" class="friends__nav friends__nav--next" id="friends-next" aria-label="Следующий стример"><svg class="ic" aria-hidden="true"><use href="#i-chevron"></use></svg></button>
    <div class="friends__dots" id="friends-dots"></div>
  </div>
</section>

<script src="modules/home/index.page.js?v=1"></script>

</body>
</html>
