<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Заказы игр — Hall of Fame</title>
<link rel="stylesheet" href="site.css?v=5">
<script>
  // Лист Games. Карточки, фильтры и загрузка — общие для всех заказов, см. orders.js.
  window.ORDERS_PAGE = {
    list: 'games',
    sheet: 'Games',
    noun: 'игр',
    csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vThU3PDQlG4EPkPHygpf1q54KuNuuc4WYWnGqZde3-8iD8buBBFLEkr3MIDdnvv-oekgEN0CXj7Bq6C/pub?gid=727100001&single=true&output=csv",
    // weight — порядок в сортировке «По статусу»; done — заказ закрыт
    statuses: [
      { id: 'pending',   label: 'В очереди', tone: 'queue',   weight: 1 },
      { id: 'playing',   label: 'Играем',    tone: 'active',  weight: 0 },
      { id: 'completed', label: 'Пройдено',  tone: 'done',    weight: 3, done: true, doneLabel: 'Пройдено' },
      { id: 'played',    label: 'Сыграно',   tone: 'played',  weight: 2, done: true, doneLabel: 'Сыграно' },
      { id: 'dropped',   label: 'Дропнуто',  tone: 'dropped', weight: 4, done: true, doneLabel: 'Дропнуто' },
    ],
    progress: 'percent',    // progress_percent; пусто — у игры нет концовки, шкалы нет
    summary: (c, total, n) => `Игры от зрителей · пройдено ${n(c.completed || 0)} · сыграно ${n(c.played || 0)} · дропнуто ${n(c.dropped || 0)} · всего ${n(total)}`,
  };
</script>
</head>
<body>
<script src="site.js?v=8"></script>

<div class="wrap">
  <header class="header">
    <h1 class="title"><svg class="ic" aria-hidden="true"><use href="#i-gamepad"></use></svg>Заказы игр<svg class="ic" aria-hidden="true"><use href="#i-gamepad"></use></svg></h1>
    <p class="subtitle" id="subtitle">Игры от зрителей</p>
  </header>

  <section class="spotlight" id="now" aria-label="Сейчас и скоро" hidden></section>

  <div class="toolbar">
    <div class="toolbar__row">
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" class="search-input" id="search-title" placeholder="Поиск по названию..." aria-label="Поиск по названию"></label>
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-user"></use></svg><input type="search" class="search-input" id="search-nick" placeholder="Поиск по заказчику..." aria-label="Поиск по заказчику"></label>
    </div>
    <div class="toolbar__row" id="status-filters"></div>
    <div class="toolbar__row" id="sort-filters"></div>
    <p class="hint">Нажми на карточку (или ПКМ), чтобы перевернуть</p>
  </div>

  <p class="shown-count" id="shown-count" hidden></p>
  <div id="status" class="empty-state">Загружаю заказы...</div>
  <ul id="grid" class="grid" hidden></ul>
  <p id="no-results" class="empty-state" hidden></p>
</div>

<script src="orders.js?v=3"></script>
</body>
</html>
