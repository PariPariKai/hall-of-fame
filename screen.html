<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Заставка — OBS</title>
<!--
  Оверлей заставок для OBS (browser source 1920×1080, прозрачный фон; видео и музыка — отдельными источниками под ним).
    screen.html?s=start   — «Стрим начинается»
    screen.html?s=brb     — «Скоро вернусь»
    screen.html?s=end     — «Стрим окончен»
  Фон экрана (настройка в админке): прозрачный — под ним видео в OBS, или «pixel» — живой пиксельный город (pixel-city.js),
  тогда и надпись с пузырями становятся пиксельными.
  Необязательно: &channel=ник — другой канал Twitch; &bg=pixel|video — фон вместо настройки;
  &demo — предпросмотр с тёмным фоном и ненастоящим чатом.
  Надпись, отсчёт и настройки — data/config.json (ключи screen_*), фразы — data/screens.json; правятся в админке
  на вкладке «Заставки», оверлей перечитывает их раз в минуту.
  Чат Twitch — анонимно, только чтение. Отсчёт идёт с момента, когда сцена стала активной в OBS.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="modules/screen/screen.page.css?v=1">
</head>
<body>
<canvas class="city" id="city" hidden></canvas>
<div class="stage" id="stage"></div>
<div class="head head--top" id="head">
  <div class="title" id="title"></div>
  <div class="sub" id="sub" hidden></div>
  <div class="timer" id="timer" hidden></div>
</div>

<script src="core/core.js?v=1"></script>
<script src="modules/screen/pixel-city.js?v=6"></script>
<script>
// Версия страницы. Менять при каждой правке screen.html, modules/screen/screen.page.js или pixel-city.js (и ?v= у pixel-city.js):
// OBS держит копию страницы до 10 минут, а так оверлей сам замечает новую версию на сайте и перезагружается.
const VERSION = '2026-11-21.2';
</script>
<script src="modules/screen/screen.page.js?v=1"></script>
</body>
</html>
