<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Зал Славы</title>

<!-- ============================================================
     ⚙ НАСТРОЙКА ⚙
     CSV_URL — лист Winners
     CURRENT_PRIZES_CSV_URL — лист CurrentPrizes
     VIEWERS_CSV_URL — лист Viewers (база зрителей с аватарками)
     ============================================================ -->
<script>
  const CSV_URL = "data/winners.json";
  const CURRENT_PRIZES_CSV_URL = "data/prizes.json";
  const VIEWERS_CSV_URL = "data/viewers.json";
</script>

<link rel="stylesheet" href="core/site.css?v=7">
<link rel="stylesheet" href="modules/hall/hall.page.css?v=1">
</head>

<body>

<script src="core/core.js?v=1"></script><script src="core/site.js?v=19"></script>

  <div class="wrap">
    <div class="header">
      <h1 class="title"><svg class="ic" aria-hidden="true"><use href="#i-crown"></use></svg>Зал Славы<svg class="ic" aria-hidden="true"><use href="#i-crown"></use></svg></h1>
      <p class="subtitle">Те, кому повезло сильнее всех</p>
    </div>

    <div class="current-prizes" id="current-prizes">
      <div class="current-prizes-header"><svg class="ic" aria-hidden="true"><use href="#i-wheel"></use></svg><span>Сейчас в рулетке</span><svg class="ic" aria-hidden="true"><use href="#i-wheel"></use></svg></div>
      <div class="carousel-viewport">
        <div class="carousel-track" id="carousel-track"></div>
      </div>
    </div>

    <div class="controls">
      <button class="chip f-btn f-all is-active" data-filter="all">Все <span class="count" id="count-all">0</span></button>
      <button class="chip f-btn f-unique" data-filter="unique"><svg class="ic" aria-hidden="true"><use href="#i-gem"></use></svg>Уникальный <span class="count" id="count-unique">0</span></button>
      <button class="chip f-btn f-artifact" data-filter="artifact"><svg class="ic ic--fill" aria-hidden="true"><use href="#i-sparkles"></use></svg>Артефакт <span class="count" id="count-artifact">0</span></button>
      <button class="chip f-btn f-legendary" data-filter="legendary"><svg class="ic ic--fill" aria-hidden="true"><use href="#i-star"></use></svg>Легендарка <span class="count" id="count-legendary">0</span></button>
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" class="search-input" id="search-input" placeholder="Поиск по нику..." aria-label="Поиск по нику"></label>
      <button class="chip sound-toggle" id="sound-toggle"></button>
    </div>

    <div id="status" class="status">Загружаю победителей...</div>
    <div id="grid" class="grid" style="display:none;"></div>
  </div>

<script src="modules/hall/hall.page.js?v=1"></script>
</body>
</html>
