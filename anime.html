<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Заказы аниме — Hall of Fame</title>
<link rel="stylesheet" href="site.css?v=4">
<script>
  // Лист Anime. Карточки, фильтры и загрузка — общие для всех заказов, см. orders.js.
  window.ORDERS_PAGE = {
    list: 'anime',
    sheet: 'Anime',
    noun: 'аниме',
    csv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vThU3PDQlG4EPkPHygpf1q54KuNuuc4WYWnGqZde3-8iD8buBBFLEkr3MIDdnvv-oekgEN0CXj7Bq6C/pub?gid=627100001&single=true&output=csv",
    // weight — порядок в сортировке «По статусу»; done — заказ закрыт
    statuses: [
      { id: 'pending',  label: 'В очереди',   tone: 'queue',  weight: 1 },
      { id: 'watching', label: 'Смотрим',     tone: 'active', weight: 0 },
      { id: 'paused',   label: 'На паузе',    tone: 'paused', weight: 2 },
      { id: 'watched',  label: 'Просмотрено', tone: 'done',   weight: 3, done: true, doneLabel: 'Досмотрено' },
    ],
    progress: 'episodes',   // episodes_watched / episodes_total
    summary: (c, total, n) => `Аниме от зрителей · просмотрено ${n(c.watched || 0)} из ${n(total)}`,
  };
</script>
</head>
<body>
<script src="site.js?v=7"></script>

<div class="wrap">
  <header class="header">
    <h1 class="title"><svg class="ic" aria-hidden="true"><use href="#i-torii"></use></svg>Заказы аниме<svg class="ic" aria-hidden="true"><use href="#i-torii"></use></svg></h1>
    <p class="subtitle" id="subtitle">Аниме от зрителей</p>
  </header>

  <section class="spotlight" id="now" aria-label="Сейчас и скоро" hidden></section>

  <div class="toolbar">
    <div class="toolbar__row">
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><input type="search" class="search-input" id="search-title" placeholder="Поиск по названию..." aria-label="Поиск по названию"></label>
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-user"></use></svg><input type="search" class="search-input" id="search-nick" placeholder="Поиск по заказчику..." aria-label="Поиск по заказчику"></label>
    </div>
    <div class="toolbar__row" id="status-filters"></div>
    <div class="toolbar__row" id="sort-filters"></div>
    <p class="hint">Нажми на карточку (или ПКМ), чтобы перевернуть</p>
  </div>

  <p class="shown-count" id="shown-count" hidden></p>
  <div id="status" class="empty-state">Загружаю заказы...</div>
  <ul id="grid" class="grid" hidden></ul>
  <p id="no-results" class="empty-state" hidden></p>
</div>

<script src="orders.js?v=3"></script>
</body>
</html>
